<style>
/* Layout: phone-first app shell. Glass cards over a drifting aurora, fixed tab bar at the bottom, detail sheets slide up. */
:root {
  --bg: #050304;
  --surface: rgba(255,228,232,0.045);
  --surface-strong: rgba(255,228,232,0.085);
  --line: rgba(255,90,110,0.16);
  --fg: #fbf2f3;
  --muted: rgba(246,214,219,0.58);
  --mint: #ff2e45;
  --pink: #ff5a6e;
  --violet: #d8233c;
  --amber: #ff8a3d;
  --sky: #ff9aa6;
  --lime: #ffc9cf;
  --deep: #9c1430;
  --display: "Unbounded", "Avenir Next", system-ui, sans-serif;
  --body: "Manrope", "SF Pro Text", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; min-height: 100vh; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }

.aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.aurora i { position: absolute; border-radius: 50%; filter: blur(100px); opacity: .30; animation: drift 18s ease-in-out infinite alternate; }
.aurora i:nth-child(1) { width: 440px; height: 440px; background: #b0102a; left: -160px; top: -180px; }
.aurora i:nth-child(2) { width: 380px; height: 380px; background: #ff2e45; right: -170px; top: 120px; opacity: .14; animation-duration: 22s; }
.aurora i:nth-child(3) { width: 420px; height: 420px; background: #5e0815; left: -120px; bottom: -200px; opacity: .5; animation-duration: 26s; }
@keyframes drift { to { transform: translate(60px, 50px) scale(1.12); } }

.app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px)); }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px 14px; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: -.01em; margin: 2px 0 0; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 600; font-size: 17px; margin: 10px 2px 0; }
.chip { font-size: 10px; font-weight: 800; letter-spacing: .12em; padding: 5px 9px; border-radius: 99px; background: rgba(255,138,61,.16); color: var(--amber); }
.chip.live { background: rgba(255,46,69,.16); color: var(--mint); }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: grid; place-items: center; cursor: pointer; }
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.stack { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 18px;
  backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%); min-width: 0; }
.card.tap { cursor: pointer; transition: transform .15s ease, background .15s; }
.card.tap:active { transform: scale(.98); background: var(--surface-strong); }
.card-title { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.card-title .dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; }
.card-title .dot svg { width: 13px; height: 13px; }
.card-title .end { margin-left: auto; letter-spacing: 0; text-transform: none; font-weight: 600; }

.hero { display: flex; gap: 18px; align-items: center; }
.ringwrap { position: relative; flex: none; }
.ringwrap .center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.big { font-family: var(--display); font-weight: 800; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.sub { font-size: 10px; font-weight: 800; letter-spacing: .2em; color: var(--muted); margin-top: 4px; }
.hero-copy strong { display: block; font-size: 17px; line-height: 1.3; margin-bottom: 6px; }
.hero-copy p { margin: 0; font-size: 12.5px; color: var(--muted); }

.pills { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 10px; margin-top: 16px; }
.pill b { display: block; font-family: var(--display); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.pill span { font-size: 11px; color: var(--muted); }

.rings-row { display: flex; gap: 18px; align-items: center; }
.legend { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.legend .row { display: flex; gap: 10px; align-items: center; }
.legend .sw { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.legend b { font-family: var(--display); font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.legend small { display: block; color: var(--muted); font-size: 11px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2 > :last-child:nth-child(odd) { grid-column: span 2; }
.tile { padding: 14px; border-radius: 22px; display: flex; flex-direction: column; gap: 6px; }
.tile .head { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; }
.tile .head svg { width: 14px; height: 14px; flex: none; }
.tile .val { font-family: var(--display); font-weight: 700; font-size: 21px; font-variant-numeric: tabular-nums; }
.tile .val small { font-family: var(--body); font-size: 11px; font-weight: 600; color: var(--muted); margin-left: 3px; }
.tile svg.spark { width: 100%; height: 34px; display: block; }

svg text { font-family: var(--body); fill: var(--muted); font-size: 10px; }
.chart { width: 100%; display: block; }

.bar-row { display: grid; grid-template-columns: 48px 1fr 60px; gap: 10px; align-items: center; font-size: 12px; font-weight: 700; }
.bar-row .track { height: 8px; border-radius: 9px; background: rgba(255,255,255,.07); overflow: hidden; }
.bar-row .fill { height: 100%; border-radius: 9px; }
.bar-row .t { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }

.status { display: flex; gap: 14px; align-items: center; }
.status .badge { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.status .badge svg { width: 22px; height: 22px; }
.status strong { display: block; font-size: 15.5px; }
.status p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }

.workout { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 22px; }
.workout .ic { width: 46px; height: 46px; border-radius: 14px; background: rgba(255,46,69,.14); color: var(--mint); display: grid; place-items: center; flex: none; }
.workout .ic svg { width: 22px; height: 22px; }
.workout .mid { flex: 1; min-width: 0; }
.workout .mid b { display: block; }
.workout .mid span, .workout .end span { font-size: 11.5px; color: var(--muted); }
.workout .end { text-align: right; }
.workout .end b { font-family: var(--display); font-size: 14px; display: block; }

.caps { display: flex; flex-direction: column; gap: 12px; }
.cap { display: flex; gap: 12px; }
.cap svg { width: 18px; height: 18px; color: var(--mint); flex: none; margin-top: 2px; }
.cap b { display: block; font-size: 14px; }
.cap span { font-size: 12px; color: var(--muted); }

.btn { appearance: none; border: 0; border-radius: 99px; padding: 14px 20px; font: 700 15px var(--body); cursor: pointer; }
.btn.primary { background: linear-gradient(135deg, #ff3b52, #c20f2b); color: #fff; box-shadow: 0 8px 30px rgba(255,46,69,.35); }
.btn.ghost { background: var(--surface-strong); color: var(--fg); border: 1px solid var(--line); }
.btn:focus-visible, .iconbtn:focus-visible, .tab:focus-visible, .card.tap:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
label.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
label.field input { font: 500 13px var(--mono); color: var(--fg); background: rgba(0,0,0,.5); border: 1px solid var(--line); border-radius: 14px; padding: 12px; width: 100%; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.warn { color: var(--amber); font-size: 12.5px; }
.foot { text-align: center; font-size: 11.5px; color: var(--muted); margin: 6px 0 0; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 8px max(10px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  background: rgba(6,3,4,.78); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border-top: 1px solid var(--line); }
nav.tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); }
.tab { appearance: none; background: none; border: 0; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; font: 700 10.5px var(--body); padding: 6px 0; cursor: pointer; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--mint); }

.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; transform: translateY(100%); transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.sheet.open { transform: none; }
.sheet .app { padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--mint); background: none; border: 0; font: 700 15px var(--body); padding: 6px 0; cursor: pointer; }
.detail-val { font-family: var(--display); font-weight: 800; font-size: 56px; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.detail-val small { font-family: var(--body); font-size: 18px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 6px; }

.onboard { min-height: calc(100vh - 40px); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 22px; }
.onboard .heart { animation: beat 1.1s ease-in-out infinite; transform-origin: center; }
@keyframes beat { 0%,100% { transform: scale(.94); } 15% { transform: scale(1.1); } 30% { transform: scale(.98); } 45% { transform: scale(1.06); } }
.onboard h1 { font-size: 44px; font-weight: 800; }
.onboard p { color: var(--muted); max-width: 30ch; margin: 0 auto; }
.onboard .btnrow { flex-direction: column; width: 100%; max-width: 340px; }

.sports { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.sport { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 20px; padding: 14px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; font: 700 12.5px var(--body); cursor: pointer; }
.sport svg { width: 26px; height: 26px; color: var(--mint); }
.sport.on { background: linear-gradient(160deg, rgba(255,46,69,.35), rgba(120,10,28,.35)); border-color: var(--mint); }
.btn[disabled] { opacity: .45; }
.btn svg { width: 16px; height: 16px; vertical-align: -3px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
label.field select { font: 500 13px var(--body); color: var(--fg); background: rgba(0,0,0,.5); border: 1px solid var(--line); border-radius: 14px; padding: 12px 8px; width: 100%; }
.live { text-align: center; padding-top: 20px; }
.arc.breathe { animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) {
  .arc.breathe { animation: none; }
  .aurora i, .onboard .heart, .iconbtn.spin svg { animation: none; }
  .sheet { transition: none; }
}
.coachcard { border-color: rgba(255,46,69,.38); background: linear-gradient(160deg, rgba(255,46,69,.10), rgba(255,228,232,.035) 55%); }
.coach-head { margin: 0; font-size: 16.5px; font-weight: 700; line-height: 1.35; }
.coach-md p { margin: 0 0 8px; }
.coach-md h3 { font: 700 11px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--mint); margin: 14px 0 6px; }
.coach-md h3:first-child { margin-top: 0; }
.coach-md ul { margin: 0 0 8px; padding-left: 18px; }
.coach-md li { margin: 0 0 5px; }
.coach-md li::marker { color: var(--mint); }
.coach-md > :last-child { margin-bottom: 0; }
.thinking { animation: breathe 1.6s ease-in-out infinite; }
.chat { display: flex; flex-direction: column; gap: 10px; }
.bubble { max-width: 88%; padding: 12px 14px; border-radius: 20px; font-size: 14.5px; overflow-wrap: anywhere; }
.bubble.me { align-self: flex-end; background: linear-gradient(135deg, #ff3b52, #c20f2b); color: #fff; border-bottom-right-radius: 6px; white-space: pre-wrap; }
.bubble.ai { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; }
.qchip { appearance: none; border: 1px solid var(--line); background: var(--surface-strong); color: var(--fg); border-radius: 99px; padding: 9px 13px; font: 600 13px var(--body); text-align: left; cursor: pointer; }
.askbar { display: flex; gap: 8px; align-items: center; }
.askbar input, textarea.goals { flex: 1; min-width: 0; font: 500 16px var(--body); color: var(--fg); background: rgba(0,0,0,.5); border: 1px solid var(--line); border-radius: 22px; padding: 12px 16px; }
textarea.goals { width: 100%; border-radius: 16px; resize: vertical; font-size: 16px; }
.iconbtn.send { width: 46px; height: 46px; flex: none; background: linear-gradient(135deg, #ff3b52, #c20f2b); border: 0; color: #fff; }
.iconbtn[disabled], .askbar input[disabled] { opacity: .5; }
a.btn { text-decoration: none; display: inline-block; }
@media (prefers-reduced-motion: reduce) { .thinking { animation: none; } }
.quickrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.qbtn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 22px; padding: 16px 6px 14px; display: flex; flex-direction: column; align-items: center; gap: 4px; font: inherit; cursor: pointer; transition: transform .12s; }
.qbtn svg { width: 28px; height: 28px; color: var(--mint); margin-bottom: 2px; }
.qbtn b { font: 700 15px var(--body); }
.qbtn span { font-size: 11px; color: var(--muted); }
.qbtn:active { transform: scale(.96); background: var(--surface-strong); }
.qbtn:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
</style>

/* ---------- demo data ---------- */
function demo() {

  const today = startOfDay(new Date());
  const days = [...Array(HISTORY)].map((_, i) => new Date(today.getTime() - (HISTORY - 1 - i) * DAY));
  const frac = Math.min(Math.max((Date.now() - today) / DAY, .25), 1);
  const ser = f => days.map((d, i) => ({ date: d, value: f(i, i === HISTORY - 1) }));
  const daily = {
    steps: ser((i, t) => (t ? frac : 1) * rnd(6500, 13500)),
    calories: ser((i, t) => (t ? frac : 1) * rnd(2050, 2850)),
    zoneMinutes: ser((i, t) => (t ? frac : 1) * rnd(8, 48)),
    activeMinutes: ser((i, t) => (t ? frac : 1) * rnd(18, 75)),
    vo2Max: ser(i => 44.2 + i * .05),
    avgHeartRate: ser(() => rnd(68, 79)),
    restingHeartRate: ser(i => 58 - i * .08 + rnd(-1.5, 1.5)),
    hrv: ser((i, t) => 46 + Math.sin(i / 2) * 6 + rnd(-3, 3) + (t ? 6 : 0)),
    spo2: ser(() => rnd(95.4, 97.8)),
    breathingRate: ser(() => rnd(13.6, 15.4)),
    skinTemp: ser(() => rnd(-.5, .5)),
  };
  daily.distance = daily.steps.map(p => ({ date: p.date, value: p.value * .00074 }));
  daily.spo2.forEach(p => { p.note = `Overnight range ${(p.value - 1.6).toFixed(1)}–${Math.min(p.value + 1.4, 100).toFixed(1)}%`; });
  daily.skinTemp.forEach(p => { p.note = `Nightly ${(33.9 + p.value).toFixed(2)} °C vs your baseline 33.90 °C`; });
  daily.vo2Max.forEach(p => { p.note = "Cardio fitness level: good"; });
  Object.values(daily).forEach(list => list.forEach(p => { p.source = "Fitbit Air (demo)"; }));

  const heart = [];
  for (let t = today.getTime(); t < Date.now(); t += 300000) {
    const d = new Date(t), h = d.getHours() + d.getMinutes() / 60;
    let b = h < 6.5 ? 54 + rnd(-3, 3) : h >= 7 && h < 7.75 ? 128 + rnd(-12, 20) : h >= 12 && h < 13 ? 88 + rnd(-6, 10) : h >= 17.5 && h < 18.25 ? 142 + rnd(-14, 18) : 72 + rnd(-8, 14);
    heart.push({ time: d, bpm: b });
  }

  const pattern = [["awake",4,12],["light",15,30],["deep",30,55],["light",20,35],["rem",12,22],["light",25,40],["deep",15,35],["light",20,30],["rem",20,30],["awake",2,6],["light",25,40],["rem",25,40],["light",20,40],["awake",2,8],["rem",20,35],["light",15,60]];
  const nights = days.map(d => {
    const end = new Date(d.getTime() + rnd(6.4, 7.6) * 3600000);
    const start = new Date(end.getTime() - rnd(6.6, 8.4) * 3600000);
    const stages = []; let cur = start.getTime();
    for (const [k, lo, hi] of pattern) {
      if (cur >= end.getTime()) break;
      const e = Math.min(cur + rnd(lo, hi) * 60000, end.getTime());
      stages.push({ kind: k, start: new Date(cur), end: new Date(e) }); cur = e;

  const types = ["Run", "Strength training", "Walk", "Outdoor bike", "HIIT", "Run"];
  const workouts = types.map((type, i) => {

  });
  return { daily, heart, nights, workouts, alerts: [], lastSync: new Date() };
}

function nightFrom(start, end, stages, summary, main) {

  return { start, end, stages, asleep, awake, inBed: (end - start) / 60000, main,

}

/* ---------- Google Health API (replaces the Fitbit Web API, which shuts off Nov 2, 2026) ---------- */
const API = "https://health.googleapis.com/v4";
const SCOPES = ["activity_and_fitness", "health_metrics_and_measurements", "sleep", "irn", "profile"]
  .map(s => `https://www.googleapis.com/auth/googlehealth.${s}.readonly`).join(" ");
function canUseGoogle() { return location.protocol === "https:" && !/claude\.ai|claudeusercontent|anthropic/.test(location.hostname) || location.hostname === "localhost"; }
function redirectUri() { return location.origin + location.pathname; }
function connect(silent) {
  const input = document.getElementById("clientId");
  const cid = (input ? input.value.trim() : "") || store.get("pulse.clientId") || window.PULSE_CLIENT_ID || "";
  if (!cid) { S.error = "Add your Google OAuth client ID first (You tab). The setup guide shows how to get one."; S.data ? (S.tab = "you", render()) : (S.data = demo(), S.mode = "demo", S.tab = "you", render()); return; }
  store.set("pulse.clientId", cid);
  const state = Math.random().toString(36).slice(2); store.set("pulse.state", state);
  const q = new URLSearchParams({ client_id: cid, redirect_uri: redirectUri(), response_type: "token", scope: SCOPES, state, include_granted_scopes: "true", prompt: silent ? "none" : (store.get("pulse.consented") ? "select_account" : "consent") });
  location.href = "https://accounts.google.com/o/oauth2/v2/auth?" + q;
}
function readRedirect() {
  if (!location.hash.includes("access_token") && !location.hash.includes("error=")) return;
  const h = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, "", location.pathname);
  if (h.get("error")) { S.error = "Tap Connect Google Health to sign in again."; return; }
  store.set("pulse.consented", "1");
  if (h.get("state") !== store.get("pulse.state")) { S.error = "Google sign-in didn't complete. Try again."; return; }
  store.set("pulse.token", JSON.stringify({ t: h.get("access_token"), exp: Date.now() + (Number(h.get("expires_in")) - 60) * 1000 }));
}
function token() { try { const v = JSON.parse(store.get("pulse.token")); return v && v.exp > Date.now() ? v.t : null; } catch { return null; } }

async function call(url, opts = {}) {
  const t = token(); if (!t) throw new Error("expired");
  const r = await fetch(url, { ...opts, headers: { Authorization: "Bearer " + t, Accept: "application/json", ...(opts.body ? { "Content-Type": "application/json" } : {}) } });
  const text = await r.text();
  if (r.status === 401) throw new Error("expired");
  if (!r.ok) { const e = new Error(`HTTP ${r.status}: ${text.slice(0, 200)}`); e.status = r.status; throw e; }
  return text ? JSON.parse(text) : {};
}
async function list(type, filter, pageSize = 1000, maxPages = 5) {
  const go = async f => {
    let out = [], tok = null;
    for (let i = 0; i < maxPages; i++) {
      const q = new URLSearchParams({ pageSize }); if (f) q.set("filter", f); if (tok) q.set("pageToken", tok);
      const j = await call(`${API}/users/me/dataTypes/${type}/dataPoints?${q}`);
      out = out.concat(j.dataPoints || []); tok = j.nextPageToken; if (!tok) break;
    }
    return out;
  };
  try { return await go(filter); } catch (e) { if (e.status === 400 && filter) return go(null); throw e; }
}
const civil = d => ({ date: { year: d.getFullYear(), month: d.getMonth() + 1, day: d.getDate() }, time: { hours: 0, minutes: 0, seconds: 0 } });
async function rollup(type, start, days) {
  const end = new Date(start.getTime() + days * DAY);
  const j = await call(`${API}/users/me/dataTypes/${type}/dataPoints:dailyRollUp`, { method: "POST", body: JSON.stringify({ range: { start: civil(start), end: civil(end) }, windowSizeDays: 1 }) });
  return j.rollupDataPoints || [];
}

/* Exact field names from Google's Health API v4 reference. No guessing: a reading that isn't where
   Google documents it is left out (shown as "—") rather than filled with a nearby number. */
const num = v => typeof v === "number" ? v : typeof v === "string" && v.trim() !== "" && !isNaN(+v) ? +v : null;
const dur = v => typeof v === "string" && /^[\d.]+s$/.test(v) ? parseFloat(v) / 60 : null;
function toDate(v) {
  if (!v) return null;
  if (typeof v === "string") { if (/^\d{4}-\d{2}-\d{2}$/.test(v)) { const [y, m, d] = v.split("-").map(Number); return new Date(y, m - 1, d); } const d = new Date(v); return isNaN(d) ? null : d; }
  if (v.year) return new Date(v.year, (v.month || 1) - 1, v.day || 1);
  if (v.date) { const d = toDate(v.date); if (d && v.time) d.setHours(v.time.hours || 0, v.time.minutes || 0); return d; }
  return null;
}
/* Daily types carry `date`, rollups carry `civilStartTime`: both are your local calendar day. */
const when = (p, pl) => toDate(pl.date) || toDate(p.civilStartTime) || toDate(pl.interval?.civilStartTime) || toDate(pl.interval?.startTime) || toDate(pl.sampleTime?.civilTime) || toDate(pl.sampleTime?.physicalTime);
const inRange = (v, lo, hi) => v != null && v >= lo && v <= hi ? v : null;

const EXTRACT = {
  steps: p => inRange(num(p.countSum), 0, 200000),                                         // StepsRollupValue.countSum
  distance: p => { const mm = num(p.millimetersSum); return mm == null ? null : inRange(mm / 1e6, 0, 400); }, // DistanceRollupValue.millimetersSum
  calories: p => inRange(num(p.kcalSum), 0, 20000),                                        // TotalCaloriesRollupValue.kcalSum
  zoneMinutes: p => { const z = ["sumInFatBurnHeartZone", "sumInCardioHeartZone", "sumInPeakHeartZone"].map(k => num(p[k]));
    return z.every(v => v == null) ? null : z.reduce((a, v) => a + (v || 0), 0); },        // ActiveZoneMinutesRollupValue
  activeMinutes: p => { const l = p.activeMinutesRollupByActivityLevel; if (!Array.isArray(l)) return null;
    return l.reduce((a, x) => a + (num(x.activeMinutesSum) || 0), 0); },                   // ActiveMinutesRollupValue
  avgHeartRate: p => inRange(num(p.beatsPerMinuteAvg), 25, 230),                           // HeartRateRollupValue
  restingHeartRate: p => inRange(num(p.beatsPerMinute), 25, 150),                          // DailyRestingHeartRate.beatsPerMinute
  hrv: p => inRange(num(p.averageHeartRateVariabilityMilliseconds), 1, 300),               // DailyHeartRateVariability (RMSSD)
  spo2: p => inRange(num(p.averagePercentage), 50, 100),                                   // DailyOxygenSaturation.averagePercentage
  breathingRate: p => inRange(num(p.breathsPerMinute), 4, 40),                             // DailyRespiratoryRate.breathsPerMinute
  skinTemp: p => { const n = num(p.nightlyTemperatureCelsius), b = num(p.baselineTemperatureCelsius);

async function sync() {

    if (store.get("pulse.clientId") && store.get("pulse.consented")) return connect(true);
    S.error = "Your Google sign-in expired. Tap Connect Google Health to sign in again."; S.mode = null; S.data = null; render(); return;
  }
  S.syncing = true; S.error = null; if (S.data) render();
  const start = new Date(startOfDay(new Date()).getTime() - (HISTORY - 1) * DAY);
  const data = { daily: {}, heart: [], nights: [], workouts: [], alerts: [], lastSync: new Date() };
  const sources = [];
  const job = async (type, fn) => { const stats = { skipped: 0 }; try { const n = await fn(stats); sources.push({ type, count: n, skipped: stats.skipped }); } catch (e) { sources.push({ type, error: e.message === "expired" ? "Sign-in expired" : e.message }); } };

      const pts = m.fetch[0] === "rollup" ? await rollup(m.fetch[1], start, HISTORY) : await list(m.fetch[1], `${m.fetch[2]}.date >= "${isoDay(start)}"`, 100);
      data.daily[m.id] = toDays(pts, m, stats); return data.daily[m.id].length;
    })),
    job("heart-rate (today)", async () => {
      const pts = await list("heart-rate", `heartRate.sample_time.physical_time >= "${iso(startOfDay(new Date()))}"`, 10000, 5);
      const b = new Map();
      for (const p of pts) { const h = p.heartRate; const v = inRange(num(h?.beatsPerMinute), 25, 230), t = toDate(h?.sampleTime?.physicalTime); if (v == null || !t) continue;
        const k = Math.floor(t.getTime() / 300000) * 300000; const c = b.get(k) || [0, 0]; b.set(k, [c[0] + v, c[1] + 1]); }
      data.heart = [...b].map(([k, [s, n]]) => ({ time: new Date(k), bpm: s / n })).sort((a, c) => a.time - c.time); return data.heart.length;
    }),
    job("sleep", async () => {
      const pts = await list("sleep", `sleep.interval.end_time >= "${iso(start)}"`, 25, 2);
      data.nights = pts.map(p => { const s = p.sleep; const a = toDate(s?.interval?.startTime), z = toDate(s?.interval?.endTime); if (!a || !z) return null;
        const stages = (s.stages || []).filter(st => st.type && st.type !== "SLEEP_STAGE_TYPE_UNSPECIFIED")
          .map(st => ({ kind: stageOf(st.type), start: toDate(st.startTime), end: toDate(st.endTime) })).filter(st => st.start && st.end && st.end > st.start).sort((x, y) => x.start - y.start);
        const sum = s.summary || {}; const meta = s.metadata || {};
        const n = nightFrom(a, z, stages, { minutesAsleep: num(sum.minutesAsleep) ?? undefined, minutesAwake: num(sum.minutesAwake) ?? undefined }, meta.mainSleep ?? !meta.nap);
        n.toFallAsleep = num(sum.minutesToFallAsleep); n.staged = s.type === "STAGES" && meta.stagesStatus !== "REJECTED_COVERAGE";
        return n;
      }).filter(Boolean); return data.nights.length;
    }),
    job("exercise", async () => {
      const pts = await list("exercise", `exercise.interval.start_time >= "${iso(start)}"`, 25, 2);
      data.workouts = pts.map(p => { const x = p.exercise; const a = toDate(x?.interval?.startTime), z = toDate(x?.interval?.endTime); if (!a || !z) return null;
        let type = x.displayName || (x.exerciseType && x.exerciseType !== "EXERCISE_TYPE_UNSPECIFIED" ? x.exerciseType : "Workout"); if (type === type.toUpperCase()) { type = type.replace(/_/g, " ").toLowerCase(); type = type[0].toUpperCase() + type.slice(1); }
        const ms = x.metricsSummary || {}, mm = num(ms.distanceMillimeters), active = dur(x.activeDuration);
        return { type, start: a, end: z, active, calories: num(ms.caloriesKcal), hr: num(ms.averageHeartRateBeatsPerMinute), km: mm == null || mm === 0 ? null : mm / 1e6,
          steps: num(ms.steps), azm: num(ms.activeZoneMinutes) };

    }),
    job("irregular-rhythm-notification", async () => {
      const pts = await list("irregular-rhythm-notification", null, 25, 1);
      data.alerts = pts.map(p => p.irregularRhythmNotification && when(p, p.irregularRhythmNotification)).filter(Boolean).sort((a, b) => b - a); return data.alerts.length;
    }),
  ]);

/* Heart-rate maths. Max HR uses the Tanaka formula (208 − 0.7 × age), which fits adults better than 220 − age.
   Zones use heart-rate reserve (Karvonen), the same idea Fitbit uses: fat burn 40–59%, cardio 60–84%, peak 85%+. */
function hrProfile() {
  const pr = W.profile(), age = num(pr.age) || 30;
  const rest = latest("restingHeartRate")?.value || 60, max = Math.round(208 - .7 * age);
  return { age, rest, max, sex: pr.sex || null, weight: num(pr.weight), ageSet: !!num(pr.age) };

  { id: "below", label: "Easy", lo: 0, color: "#6b4a50" },
  { id: "fat", label: "Fat burn", lo: .4, color: C.amber },
  { id: "cardio", label: "Cardio", lo: .6, color: C.mint },
  { id: "peak", label: "Peak", lo: .85, color: "#ff1033" },

    const next = during[i + 1]?.t || end, dt = Math.min((next - during[i].t) / 60000, .5);
    covered += dt; zones[zoneOf(during[i].bpm, h)] += dt;
    const hrr = Math.max(0, Math.min(1, (during[i].bpm - h.rest) / (h.max - h.rest)));

    coverage: mins > 0 ? Math.min(covered / mins, 1) : 0, zones,
    load: Math.round(trimp), recovery1: endHr != null && r1 != null ? Math.round(endHr - r1) : null, recovery2: endHr != null && r2 != null ? Math.round(endHr - r2) : null,

async function fetchSession(sess) {
  const a = new Date(sess.start), z = new Date(sess.end), z3 = new Date(z.getTime() + 180000);
  const span = (field, from, to) => `${field} >= "${iso(from)}" AND ${field} < "${iso(to)}"`;
  const inside = (d, from, to) => d && d >= from && d < to;
  const [hrPts, stepPts, distPts, azmPts, kcal] = await Promise.all([
    list("heart-rate", span("heartRate.sample_time.physical_time", a, z3), 10000, 4),
    list("steps", span("steps.interval.start_time", a, z), 1440, 2).catch(() => null),
    list("distance", span("distance.interval.start_time", a, z), 1440, 2).catch(() => null),
    list("active-zone-minutes", span("activeZoneMinutes.interval.start_time", a, z), 1440, 2).catch(() => null),
    call(`${API}/users/me/dataTypes/total-calories/dataPoints:rollUp`, { method: "POST",
      body: JSON.stringify({ range: { startTime: iso(a), endTime: iso(z) }, windowSize: Math.max(60, Math.round((z - a) / 1000)) + "s" }) })
      .then(j => (j.rollupDataPoints || []).reduce((s, p) => s + (num(p.totalCalories?.kcalSum) || 0), 0) || null).catch(() => null),
  ]);
  // Every point is re-checked against the session window, so nothing outside your workout is counted.
  const hr = hrPts.map(p => ({ t: toDate(p.heartRate?.sampleTime?.physicalTime), bpm: inRange(num(p.heartRate?.beatsPerMinute), 25, 230) }))
    .filter(s => s.t && s.bpm != null && inside(s.t, a, z3));
  const sum = (pts, key, field) => pts == null ? null : pts.filter(p => inside(toDate(p[key]?.interval?.startTime), a, z)).reduce((s, p) => s + (num(p[key]?.[field]) || 0), 0);
  const mm = sum(distPts, "distance", "millimeters");
  return analyse(sess, { hr, steps: sum(stepPts, "steps", "count"), km: mm == null ? null : mm / 1e6, azm: sum(azmPts, "activeZoneMinutes", "activeZoneMinutes"), kcal });
}

function demoSession(sess) {
  const a = new Date(sess.start), z = new Date(sess.end), k = INTENSITY[sess.sport] || .6, h = hrProfile();
  const target = b => h.rest + (h.max - h.rest) * b;

  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let t = a.getTime(); t <= z.getTime() + 180000; t += 5000) {
    const p = (t - a) / Math.max(z - a, 1);
    let b = t > z.getTime() ? target(k) - (t - z) / 1000 * .28 : target(Math.min(k * (.55 + p * 4), k + .12 * Math.sin(p * 14)));
    hr.push({ t: new Date(t), bpm: Math.max(h.rest + 5, b + (rnd() - .5) * 8) });

  return analyse(sess, { hr, steps: ["Running", "Walking", "Hiking", "Football", "Basketball", "Tennis", "Padel", "Dance"].includes(sess.sport) ? Math.round(mins * (sess.sport === "Running" ? 160 : 95)) : null,

function sessionChart(r, start, end) {

const COACH_SYSTEM = `You are Claude, built into Pulse, a personal health app that reads one person's Fitbit Air data. You are their health coach. They play padel and football, lift weights and do hydro physiotherapy, and they want honest, accurate guidance that helps them get healthier and perform better.

How to work:
- Use only the numbers in the data below. Never invent a reading. If something they ask about isn't in the data, say so in one line.
- Judge each number against their own 14-day baseline first, then against general norms. Name the actual numbers ("HRV 41 ms vs your 48 average").
- Fitbit Air has no ECG, GPS or stress sensor. Pulse Charge and the sleep score are Pulse's own estimates. Totals for today are partial until the day ends.
- Training advice is concrete: what to do today, how hard (easy, moderate, hard, or a heart-rate range), and for how long.
- You are not a doctor and don't diagnose. If you see irregular-rhythm alerts, average SpO2 under 92%, resting heart rate 8+ bpm above baseline for 3+ days, or skin temperature 1 °C+ above baseline, say calmly that it's worth checking with a doctor, and why.
- If the data source says DEMO DATA, mention once, briefly, that these are sample numbers.
- Write like a good coach texting: warm, direct, short sentences, no filler. Use **bold** only for the key number or action. Use "- " for bullets and "## " for section headings. No tables.`;

const CHECKUP_ASK = `Give me today's checkup. Format:
First line: one punchy sentence on how my body is doing today (no heading).
## How you're doing
2 to 4 sentences covering recovery (sleep, HRV, resting HR, Charge) and activity, with the key numbers vs my baseline.
## Today's plan
3 bullets: training (what and how hard), recovery or sleep, and one small habit toward my goals.
## Watch
Only if something genuinely needs attention: 1 or 2 bullets. Otherwise leave this section out.
Keep it under 220 words.`;

function coachContext() { return `${COACH_SYSTEM}\n\nTheir data right now (JSON):\n${JSON.stringify(healthSummary())}`; }

/* One call to Claude. onText gets the whole answer so far. */
async function askClaude(messages, onText) {
  const be = coachBackend();
  if (be === "api") {
    const { default: Anthropic } = await import(SDK_URL);
    const client = new Anthropic({ apiKey: CO.key(), dangerouslyAllowBrowser: true });
    const stream = client.beta.messages.stream({
      model: COACH_MODEL, max_tokens: 16000,
      thinking: { type: "adaptive" }, output_config: { effort: "medium" },
      betas: ["server-side-fallback-2026-07-01"], fallbacks: "default", // if a safety check declines, the API retries on another model
      system: coachContext(), messages,
    });
    stream.on("text", (_, snapshot) => onText(snapshot));
    let msg;
    try { msg = await stream.finalMessage(); }
    catch (e) {
      const st = e?.status;
      throw new Error(st === 401 ? "Claude didn't accept that API key. Check it in the Claude coach settings below."
        : st === 429 ? "Too many requests right now. Try again in a minute."
        : st === 529 || st >= 500 ? "Claude is busy right now. Try again in a minute."
        : /credit balance/i.test(e?.message || "") ? "Your Anthropic account is out of credit. Add some at console.anthropic.com → Billing."
        : e?.message || "Couldn't reach Claude.");
    }
    if (msg.stop_reason === "refusal") throw new Error("Claude couldn't answer that one. Try asking another way.");
    return msg.content.filter(b => b.type === "text").map(b => b.text).join("");
  }
  if (be === "sample") {
    const input = messages.map((m, i) => ({ role: m.role, content: i === 0 ? `${coachContext()}\n\n---\n\n${m.content}` : m.content }));
    try { return (await CO.sample(input, { onText: ({ text }) => onText(text), cache: false })).text; }
    catch (e) {
      if (e?.code === "not_granted") { CO.sample = null; throw new Error("Claude wasn't allowed in this preview. Allow it from the page's permissions, or add an API key on Pulse's own web address."); }
      throw new Error(e?.code === "rate_limited" ? "Too many requests right now. Try again in a minute." : e?.message || "Couldn't reach Claude.");
    }
  }
  throw new Error("handoff");
}

/* Tiny, safe Markdown: headings, bullets, bold. */
function md(text) {
  const out = []; let list = false;
  for (const raw of String(text).split("\n")) {
    const line = esc(raw.trim()).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    if (/^[-•*] /.test(raw.trim())) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${line.slice(2)}</li>`); continue; }
    if (list) { out.push("</ul>"); list = false; }
    if (!line) continue;
    out.push(/^#{1,3} /.test(raw.trim()) ? `<h3>${line.replace(/^#{1,3} /, "")}</h3>` : `<p>${line}</p>`);
  }
  if (list) out.push("</ul>");
  return out.join("");
}

function paintLive() {
  const el = document.querySelector("[data-live]"); if (!el) return;
  el.innerHTML = CO.live ? md(CO.live) : `<p class="note thinking">Claude is reading your data…</p>`;
}

async function runCheckup() {
  if (CO.busy || !S.data) return;
  await sampleChannel();
  if (coachBackend() === "handoff") return handoff(CHECKUP_ASK);
  CO.busy = "checkup"; CO.live = ""; CO.error = null; render();
  try {
    const text = await askClaude([{ role: "user", content: CHECKUP_ASK }], t => { CO.live = t; paintLive(); });
    store.set("pulse.checkup", JSON.stringify({ day: localDay(), text, at: Date.now(), mode: S.mode }));
  } catch (e) { CO.error = e.message; }
  CO.busy = null; CO.live = ""; render();
}

async function sendChat(q) {
  q = String(q || "").trim();
  if (!q || CO.busy || !S.data) return;
  await sampleChannel();
  if (coachBackend() === "handoff") return handoff(q);
  const msgs = [...CO.chat(), { role: "user", content: q }];
  CO.saveChat(msgs); CO.busy = "chat"; CO.live = ""; CO.error = null;
  if (S.tab !== "coach") { S.tab = "coach"; store.set("pulse.tab", "coach"); }
  render(); scrollChat();
  try {
    const text = await askClaude(msgs.slice(-12), t => { CO.live = t; paintLive(); scrollChat(); });
    CO.saveChat([...msgs, { role: "assistant", content: text }]);
  } catch (e) { CO.error = e.message; CO.saveChat(msgs.slice(0, -1)); }
  CO.busy = null; CO.live = ""; render(); scrollChat();
}
const scrollChat = () => { const el = document.getElementById("chatEnd"); if (el) el.scrollIntoView({ block: "end", behavior: "smooth" }); };

/* No key and not in the preview: hand the summary to the Claude app. */
async function handoff(ask) {
  const prompt = `${COACH_SYSTEM}\n\nMy data right now (JSON):\n${JSON.stringify(healthSummary())}\n\n${ask}`;
  let copied = false;
  try { await navigator.clipboard.writeText(prompt); copied = true; } catch {}
  const url = "https://claude.ai/new" + (prompt.length < 6000 ? "?q=" + encodeURIComponent(prompt) : "");
  CO.error = copied ? (prompt.length < 6000 ? null : "Your data is copied. Paste it into the new Claude chat that just opened.") : "Couldn't copy automatically. Add an API key below to chat with Claude right here.";
  window.open(url, "_blank", "noopener");
  render();
}

/* Auto checkup: the first time you open Pulse each day with a key set, after your data syncs. */
function coachAuto() {
  if (S.mode === "live" && CO.key() && canUseGoogle() && !CO.checkup() && !CO.busy && S.data) runCheckup();
}

function checkupCard(compact) {
  const c = CO.checkup(), be = coachBackend();
  const headLine = c ? c.text.split("\n").find(l => l.trim()) || "" : "";
  if (compact) {
    if (CO.busy === "checkup") return `<button class="card tap coachcard" data-c="go" style="text-align:left;color:inherit;font:inherit">${title("Claude's checkup", "claude", C.mint, "reading…")}<p class="note thinking">Claude is reading last night and today…</p></button>`;
    return `<button class="card tap coachcard" data-c="${c ? "go" : "checkup"}" style="text-align:left;color:inherit;font:inherit">
      ${title("Claude's checkup", "claude", C.mint, c ? time(new Date(c.at)) : "")}
      ${c ? `<p class="coach-head">${md(headLine).replace(/<\/?(p|h3)>/g, "")}</p><p class="note" style="margin-top:6px">Tap for today's plan →</p>`
          : `<p style="margin:0">Get today's read on your recovery and a plan for the day.</p><p class="note" style="margin-top:6px">${be === "handoff" ? "Opens Claude with your data →" : "Tap to ask Claude →"}</p>`}
    </button>`;
  }
  let body;
  if (CO.busy === "checkup") body = `<div class="coach-md" data-live>${CO.live ? md(CO.live) : `<p class="note thinking">Claude is reading your data…</p>`}</div>`;
  else if (c) body = `<div class="coach-md">${md(c.text)}</div><div class="btnrow" style="margin-top:12px"><button class="btn ghost" data-c="checkup">${icon("sync")} Run again</button></div>`;
  else body = `<p style="margin:0 0 12px">Claude reads your sleep, heart, activity and workouts against your own baseline and tells you how you're doing and what to do today.</p>
    <button class="btn primary" data-c="checkup" style="width:100%">${be === "handoff" ? "Open in Claude with my data" : "Get today's checkup"}</button>`;
  return `<div class="card coachcard">${title("Today's checkup", "claude", C.mint, c ? `${time(new Date(c.at))}` : dateLine().split(",")[0])}${body}</div>`;
}

const QUICK = ["How should I train today?", "Am I recovering well this week?", "How can I sleep better?", "Plan my next 7 days of padel, football and lifting"];
function coachScreen() {
  const be = coachBackend(), msgs = CO.chat(), keyed = !!CO.key();
  return header("Claude", "Your coach") + `<div class="stack">
    ${CO.error ? `<div class="card warn">${esc(CO.error)}</div>` : ""}
    ${checkupCard(false)}
    <h2>Ask Claude</h2>
    <div class="chat">
      ${msgs.map(m => m.role === "user" ? `<div class="bubble me">${esc(m.content)}</div>` : `<div class="bubble ai coach-md">${md(m.content)}</div>`).join("")}
      ${CO.busy === "chat" ? `<div class="bubble ai coach-md" data-live>${CO.live ? md(CO.live) : `<p class="note thinking">Thinking…</p>`}</div>` : ""}
      ${!msgs.length && CO.busy !== "chat" ? `<div class="quick">${QUICK.map(q => `<button class="qchip" data-c="ask" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>` : ""}
      <div id="chatEnd"></div>
    </div>
    <form class="askbar" id="askForm"><input id="coachQ" placeholder="Ask about your sleep, heart, training…" autocomplete="off" ${CO.busy ? "disabled" : ""}><button class="iconbtn send" aria-label="Send" ${CO.busy ? "disabled" : ""}>${icon("send")}</button></form>
    ${msgs.length ? `<button class="btn ghost" data-c="clear" style="align-self:center">New conversation</button>` : ""}
    <div class="card">${title("Your goals", "spark", C.amber)}
      <p class="note" style="margin-bottom:10px">Claude shapes every checkup and answer around these.</p>
      <textarea id="coachGoals" class="goals" rows="3" placeholder="e.g. Drop 4 kg by March, sleep 7.5 h, more power in padel, finish hydro physio for my knee">${esc(CO.goals())}</textarea></div>
    ${canUseGoogle() ? `<div class="card">${title("Connect Claude", "link", C.sky, keyed ? "connected" : "")}
      <p class="note" style="margin-bottom:12px">${keyed ? "Claude runs right here in Pulse with your own key." : "Add your Anthropic API key to get your checkup automatically every morning and chat with Claude inside Pulse. Without it, Pulse opens the Claude app with your data instead."}</p>
      <label class="field" for="anthKey">Anthropic API key<input id="anthKey" type="password" value="${esc(CO.key())}" placeholder="sk-ant-…" autocomplete="off" spellcheck="false"></label>
      <div class="btnrow" style="margin-top:10px"><button class="btn primary" data-c="savekey">Save key</button>${keyed ? `<button class="btn ghost" data-c="dropkey">Remove</button>` : `<a class="btn ghost" href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">Get a key</a>`}</div></div>`
    : be === "sample" ? `<p class="note">In this preview Claude coaches you on the demo data through claude.ai. On Pulse's own web address it reads your real Fitbit Air data.</p>` : ""}
    <p class="foot">Claude sees a summary of your numbers (no name, no Google account) ${be === "api" ? "sent from this phone straight to Anthropic" : be === "sample" ? "through claude.ai" : "only when you open it in the Claude app"}. Claude is a coach, not a doctor.</p>
  </div>`;
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-c]"); if (!t) return;
  const a = t.dataset.c;
  if (a === "go") { S.tab = "coach"; store.set("pulse.tab", "coach"); render(); scrollTo(0, 0); }
  else if (a === "checkup") { if (S.tab !== "coach" && coachBackend() !== "handoff") { S.tab = "coach"; store.set("pulse.tab", "coach"); scrollTo(0, 0); } runCheckup(); }
  else if (a === "ask") sendChat(t.dataset.q);
  else if (a === "clear") { CO.saveChat([]); CO.error = null; render(); }
  else if (a === "savekey") { const k = document.getElementById("anthKey").value.trim(); store.set("pulse.anthropicKey", k || null); CO.error = null; render(); if (k) coachAuto(); }
  else if (a === "dropkey") { store.set("pulse.anthropicKey", null); render(); }
  else if (a === "debrief") {
    const s = W.sessions().find(x => x.id === t.dataset.id); if (!s) return;
    closeSheet();
    sendChat(`Debrief my ${s.sport} session from ${new Date(s.start).toLocaleString([], { weekday: "long", hour: "numeric", minute: "2-digit" })}: how did my body handle it, what does my recovery say, and what should I do before the next one?`);
  }
});
document.addEventListener("submit", e => { if (e.target.id !== "askForm") return; e.preventDefault(); const q = document.getElementById("coachQ").value; sendChat(q); });
document.addEventListener("change", e => { if (e.target.id === "coachGoals") store.set("pulse.goals", e.target.value.trim() || null); });
sampleChannel().then(ch => { if (ch && S.data) render(); });

/* ---------- boot ---------- */
S.tab = store.get("pulse.tab") || "today";
if (canUseGoogle()) readRedirect();
if (canUseGoogle() && (token() || (store.get("pulse.consented") && store.get("pulse.clientId") && !S.error))) { S.mode = "live"; sync(); render(); }
else if (canUseGoogle()) render();
else { S.mode = "demo"; S.data = demo(); render(); }
})();
</script>
