function demo() {

    avgHeartRate: ser(() => rnd(68, 79)),
    restingHeartRate: ser(i => 58 - i * .08 + rnd(-1.5, 1.5)),
    hrv: ser((i, t) => 46 + Math.sin(i / 2) * 6 + rnd(-3, 3) + (t ? 6 : 0)),
    spo2: ser(() => rnd(95.4, 97.8)),
    breathingRate: ser(() => rnd(13.6, 15.4)),
    skinTemp: ser(() => rnd(-.5, .5)),
  };
  daily.distance = daily.steps.map(p => ({ date: p.date, value: p.value * .00074 }));
  daily.spo2.forEach(p => { p.note = `Overnight range ${(p.value - 1.6).toFixed(1)}–${Math.min(p.value + 1.4, 100).toFixed(1)}%`; });
  daily.skinTemp.forEach(p => { p.note = `Nightly ${(33.9 + p.value).toFixed(2)} °C vs your baseline 33.90 °C`; });
  daily.vo2Max.forEach(p => { p.note = "Cardio fitness level: good"; });
  Object.values(daily).forEach(list => list.forEach(p => { p.source = "Fitbit Air (demo)"; }));

  const heart = [];
  for (let t = today.getTime(); t < Date.now(); t += 300000) {
    const d = new Date(t), h = d.getHours() + d.getMinutes() / 60;
    let b = h < 6.5 ? 54 + rnd(-3, 3) : h >= 7 && h < 7.75 ? 128 + rnd(-12, 20) : h >= 12 && h < 13 ? 88 + rnd(-6, 10) : h >= 17.5 && h < 18.25 ? 142 + rnd(-14, 18) : 72 + rnd(-8, 14);

  const pattern = [["awake",4,12],["light",15,30],["deep",30,55],["light",20,35],["rem",12,22],["light",25,40],["deep",15,35],["light",20,30],["rem",20,30],["awake",2,6],["light",25,40],["rem",25,40],["light",20,40],["awake",2,8],["rem",20,35],["light",15,60]];
  const nights = days.map(d => {
    const end = new Date(d.getTime() + rnd(6.4, 7.6) * 3600000);
    const start = new Date(end.getTime() - rnd(6.6, 8.4) * 3600000);
    const stages = []; let cur = start.getTime();
    for (const [k, lo, hi] of pattern) {

}

}

  let marks;
  if (m.total) {
    marks = pts.map((p, i) => `<rect x="${cx(i) - slot * .32}" y="${s.y(p.value)}" width="${slot * .64}" height="${Math.max(s.y(s.lo) - s.y(p.value), 1)}" rx="5" fill="${i === sel ? "#fff" : m.tint}" fill-opacity="${i === sel || sel == null ? 1 : .55}"/>`).join("");
  } else {
    const xy = pts.map((p, i) => [cx(i), s.y(p.value)]);
    marks = `<path d="${smooth(xy)}" fill="none" stroke="${m.tint}" stroke-width="3" stroke-linecap="round"/>` +
      xy.map(([px, py], i) => `<circle cx="${px}" cy="${py}" r="${i === sel ? 6 : 3}" fill="${i === sel ? "#fff" : m.tint}"/>`).join("");
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${m.title}, last ${pts.length} days" id="dchart">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${s.y(v)}" y2="${s.y(v)}" stroke="#ffd6dc" stroke-opacity=".07"/><text x="${W - R + 6}" y="${s.y(v) + 3}">${fmt(m, v)}</text>`).join("")}
    ${m.total && m.goal ? `<line x1="${L}" x2="${W - R}" y1="${s.y(m.goal)}" y2="${s.y(m.goal)}" stroke="${m.tint}" stroke-opacity=".6"/><text x="${L + 2}" y="${s.y(m.goal) - 5}" style="fill:${m.tint}">Goal</text>` : ""}
    ${a != null ? `<line x1="${L}" x2="${W - R}" y1="${s.y(a)}" y2="${s.y(a)}" stroke="#fff" stroke-opacity=".3" stroke-dasharray="4 4"/>` : ""}
    ${marks}
    ${pts.map((p, i) => i % 2 === pts.length % 2 ? "" : `<text x="${cx(i)}" y="${H - 6}" text-anchor="middle">${p.date.toLocaleDateString([], { weekday: "narrow" })}</text>`).join("")}
    <rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent" data-slots="${pts.length}"/></svg>`;
}
function nightsChart(nights) {
  const W = 340, H = 150, L = 4, R = 26, T = 10, B = 22;
  const s = scaleY(nights.map(n => n.asleep / 60).concat(9), H - B, T, true);
  const slot = (W - L - R) / nights.length, id = "n" + (++uid);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Hours asleep per night">
    <defs><linearGradient id="${id}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${C.violet}"/><stop offset="1" stop-color="${C.sky}"/></linearGradient></defs>
    ${[0, 4, 8].map(v => `<line x1="${L}" x2="${W - R}" y1="${s.y(v)}" y2="${s.y(v)}" stroke="#fff" stroke-opacity="${v === 8 ? .25 : .06}" ${v === 8 ? 'stroke-dasharray="4 4"' : ""}/><text x="${W - R + 6}" y="${s.y(v) + 3}">${v}h</text>`).join("")}
    ${nights.map((n, i) => `<rect x="${L + slot * i + slot * .18}" y="${s.y(n.asleep / 60)}" width="${slot * .64}" height="${s.y(0) - s.y(n.asleep / 60)}" rx="5" fill="url(#${id})"/>`).join("")}
    ${nights.map((n, i) => i % 2 ? "" : `<text x="${L + slot * (i + .5)}" y="${H - 6}" text-anchor="middle">${n.end.toLocaleDateString([], { weekday: "narrow" })}</text>`).join("")}</svg>`;
}

/* ---------- small pieces ---------- */
const fmtDur = min => { const t = Math.round(min); return t >= 60 ? `${Math.floor(t / 60)}h ${t % 60}m` : `${t}m`; };
const time = d => d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const title = (text, ic, tint, end = "") => `<div class="card-title"><span class="dot" style="background:${tint}22">${icon(ic, tint)}</span>${text}${end ? `<span class="end">${end}</span>` : ""}</div>`;
const pill = (label, value, tint = "var(--fg)") => `<div class="pill"><b style="color:${tint}">${value}</b><span>${label}</span></div>`;
function tile(id) {
  const m = M[id], l = latest(id);
  return `<button class="card tap tile" data-metric="${id}" style="text-align:left;color:inherit;font:inherit">
    <div class="head">${icon(m.icon, m.tint)}${m.title}</div>
    ${l ? `<div class="val">${fmt(m, l.value)}<small>${m.unit}</small></div>${spark(series(id), m.tint, m.total)}`
        : `<div class="val" style="color:var(--muted)">—</div><div class="note" style="height:34px">No data yet</div>`}
  </button>`;
}
const tiles = ids => `<div class="grid2">${ids.map(tile).join("")}</div>`;
const empty = (head, msg, ic) => `<div class="card" style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px"><span style="width:34px;height:34px;color:var(--muted)">${icon(ic)}</span><b>${head}</b><p class="note">${msg}</p></div>`;
function activityRings() {
  const rs = ["steps", "zoneMinutes", "calories"];
  return `<div class="card rings-row">
    <div class="ringwrap" style="width:132px;height:132px">${rs.map((id, i) => `<div style="position:absolute;inset:${i * 17}px">${ring((todayVal(id) || 0) / M[id].goal, [M[id].tint, M[id].tint + "99"], 132 - i * 34, 13)}</div>`).join("")}</div>
    <div class="legend">${rs.map(id => { const m = M[id]; return `<div class="row"><span class="sw" style="background:${m.tint}"></span><div><b>${fmt(m, todayVal(id) || 0)} ${m.unit}</b><small>${m.title} · goal ${fmt(m, m.goal)}</small></div></div>`; }).join("")}</div>
  </div>`;
}

/* ---------- screens ---------- */
function greeting() { const h = new Date().getHours(); return h >= 5 && h < 12 ? "Good morning" : h < 18 && h >= 12 ? "Good afternoon" : "Good evening"; }
function header(eyebrow, h) {
  return `<header class="top"><div><div class="eyebrow">${eyebrow}</div><h1>${h}</h1></div>
    <div style="display:flex;gap:8px;align-items:center"><span class="chip ${S.mode === "live" ? "live" : ""}">${S.mode === "live" ? "LIVE" : "DEMO"}</span>
    <button class="iconbtn ${S.syncing ? "spin" : ""}" id="syncBtn" aria-label="Refresh">${icon("sync")}</button></div></header>
    ${S.error ? `<div class="card warn" style="margin-bottom:14px">${esc(S.error)}</div>` : ""}`;
}
const dateLine = () => new Date().toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });

function todayScreen() {
  const ch = charge(), n = lastNight(), d = S.data;
  const hr = d.heart, now = hr.length ? Math.round(hr[hr.length - 1].bpm) : null;
  return header(dateLine(), greeting()) + `<div class="stack">
    <div class="card${ch != null ? " tap" : ""}" ${ch != null ? 'data-rec="open" role="button" tabindex="0"' : ""}>
      <div class="hero">
        <div class="ringwrap" style="width:148px;height:148px">${ring((ch || 0) / 100, [C.mint, C.sky, C.violet], 148, 16)}
          <div class="center"><div><div class="big" style="font-size:44px">${ch ?? "—"}</div><div class="sub">RECOVERY</div></div></div></div>
        <div class="hero-copy"><strong>${ch != null ? chargeLabel(ch) : "Wear your Air tonight to get your first recovery score."}</strong>
          <p>From your HRV, resting heart rate, sleep, sleep debt, training strain and illness signs, each vs your own normal. Tap for details.</p></div>
      </div>
      <div class="pills">${pill("Sleep score", n ? sleepScore(n) : "—", C.violet)}${pill("HRV", latest("hrv") ? Math.round(latest("hrv").value) + " ms" : "—", C.sky)}${pill("Resting HR", latest("restingHeartRate") ? Math.round(latest("restingHeartRate").value) + " bpm" : "—", C.pink)}</div>
    </div>
    ${checkupCard(true)}
    ${sickCard(false)}
    ${quickBlock()}
    ${batteryCard()}
    ${activityRings()}
    ${weekCard()}
    ${hr.length > 1 ? `<button class="card tap" data-metric="avgHeartRate" style="text-align:left;color:inherit;font:inherit">${title("Heart rate today", "heart", C.pink, now ? now + " bpm now" : "")}${hrChart(hr)}</button>` : ""}
    ${["Activity", "Heart", "Body & recovery"].map(cat => `<h2>${cat}</h2>${tiles(METRICS.filter(m => m.cat === cat).map(m => m.id))}`).join("")}

  </div>`;
}

function sleepScreen() {
  const n = lastNight(), nights = mainNights().slice(-HISTORY);
  let body;
  if (!n) body = empty("No sleep yet", "Wear your Fitbit Air to bed and your sleep stages show up here in the morning.", "moon");
  else {
    const sc = sleepScore(n), total = Math.max(n.stages.reduce((a, s) => a + (s.end - s.start) / 60000, 0), 1);
    body = `<div class="card hero">
        <div class="ringwrap" style="width:124px;height:124px">${ring(sc / 100, [C.violet, C.sky], 124, 14)}<div class="center"><div><div class="big" style="font-size:36px">${sc}</div><div class="sub">SCORE</div></div></div></div>
        <div class="hero-copy"><div class="eyebrow">Last night</div><div class="big" style="font-size:32px;margin:6px 0 10px">${fmtDur(n.asleep)}</div>
          <div class="pills" style="margin:0">${pill("Efficiency", Math.round(n.asleep / n.inBed * 100) + "%", C.mint)}${pill("Awake", fmtDur(n.awake), C.amber)}${n.toFallAsleep != null ? pill("Fell asleep in", fmtDur(n.toFallAsleep), C.sky) : ""}</div></div>
      </div>
      ${n.stages.length ? `<div class="card">${title("Stages", "bars", C.violet, `${time(n.start)} – ${time(n.end)}`)}${hypnogram(n)}
        <div class="stack" style="gap:10px;margin-top:14px">${STAGES.map(st => { const mins = n.minutes([st.id]);
          return `<div class="bar-row"><span>${st.label}</span><div class="track"><div class="fill" style="width:${mins / total * 100}%;background:${st.color}"></div></div><span class="t">${fmtDur(mins)}</span></div>`; }).join("")}</div></div>` : ""}
      <div class="card">${title(`Last ${nights.length} nights`, "cal", C.sky, "avg " + fmtDur(avg(nights.map(x => x.asleep))))}${nightsChart(nights)}</div>`;
  }
  return header("Sleep", "Recovery") + `<div class="stack">${bedBlock()}${body}<h2>While you slept</h2>${tiles(["hrv", "breathingRate", "spo2", "skinTemp"])}</div>`;
}

function heartScreen() {
  const hr = S.data.heart, b = hr.map(p => p.bpm), alerts = S.data.alerts;
  return header("Heart", "Your heart") + `<div class="stack">
    ${hr.length > 1 ? `<div class="card">${title("Today", "heart", C.pink)}
      <div class="pills" style="margin:0 0 12px">${pill("Now", Math.round(b[b.length - 1]), C.pink)}${pill("Low", Math.round(Math.min(...b)), C.sky)}${pill("High", Math.round(Math.max(...b)), C.amber)}${pill("Resting", latest("restingHeartRate") ? Math.round(latest("restingHeartRate").value) : "—", C.mint)}</div>
      ${hrChart(hr, 180)}<p class="note" style="margin-top:8px">Based on ${fmtDur(hr.length * 5)} of heart-rate readings today, shown as the middle value of every 5 minutes.</p>

function workoutIcon(t) { t = t.toLowerCase(); return t.includes("bike") || t.includes("cycl") ? "bike" : t.includes("swim") ? "swim" : t.includes("strength") || t.includes("weight") ? "lift" : t.includes("walk") || t.includes("hike") ? "walk" : "run"; }
function activityScreen() {

    ${workoutCard()}

    <div class="card status"><div class="ringwrap" style="width:64px;height:64px">${ring(week / 150, [C.pink, C.amber], 64, 9)}</div>
      <div><strong>${Math.round(week)} / 150 zone minutes</strong><p>${week >= 150 ? "Weekly target hit. Nice work." : `${Math.round(150 - week)} more this week to hit the WHO target.`}</p></div></div>
    ${tiles(METRICS.filter(m => m.cat === "Activity").map(m => m.id))}

    <h2>Workouts your Air logged</h2>

      : empty("No workouts yet", "Exercise sessions from your Air appear here.", "run")}
  </div>`;
}

const CAPS = [
  ["heart", "24/7 heart rate", "Optical sensor, every 2 seconds"],
  ["wave", "Resting heart rate & HRV", "Your recovery baseline, measured overnight"],
  ["shield", "Irregular rhythm (AFib) checks", "Watches for signs of AFib while you're still or asleep"],
  ["moon", "Sleep stages & sleep score", "Light, deep, REM and awake time every night"],
  ["drop", "Blood oxygen (SpO₂)", "Red and infrared sensors, overnight"],
  ["wind", "Breathing rate", "Breaths per minute while you sleep"],
  ["temp", "Skin temperature variation", "Nightly change from your baseline"],
  ["walk", "Steps, distance & calories", "3-axis accelerometer and gyroscope"],
  ["bolt", "Active Zone Minutes", "Fat-burn, cardio and peak heart-rate zones"],
  ["gauge", "Cardio fitness (VO₂ max)", "Estimated aerobic fitness"],
  ["run", "Workouts", "Exercise sessions with time, heart rate and calories"],

];
function youScreen() {

  return header("You", "Settings") + `<div class="stack">
    <div class="card">${title("Connection", "link", C.sky)}
      <div class="stack" style="gap:12px">
        <b>${S.mode === "live" ? "Connected to Google Health" : "Showing demo data"}</b>
        ${S.mode === "live" && S.data.lastSync ? `<p class="note">Last sync ${S.data.lastSync.toLocaleString([], { dateStyle: "medium", timeStyle: "short" })}</p>` : ""}
        ${canConnect ? `
          <label class="field" for="clientId">Google OAuth client ID<input id="clientId" value="${esc(cid)}" placeholder="1234-abc.apps.googleusercontent.com" autocomplete="off" spellcheck="false" autocapitalize="off" autocorrect="off"></label>
          <div class="btnrow">${S.mode === "live" ? `<button class="btn primary" id="syncNow">Sync now</button><button class="btn ghost" id="signOut">Sign out</button>` : `<button class="btn primary" id="connect">Connect Google Health</button>`}</div>`

    <div class="card">${title("What your Fitbit Air tracks", "spark", C.mint)}<div class="caps">${CAPS.map(([ic, n, d]) => `<div class="cap">${icon(ic)}<div><b>${n}</b><span>${d}</span></div></div>`).join("")}</div></div>
    ${S.sources.length ? `<div class="card">${title("Data inspector", "info", C.violet)}<div class="stack" style="gap:8px">${S.sources.map(s => `<div style="display:flex;justify-content:space-between;gap:10px;font:500 12px var(--mono)"><span style="min-width:0;overflow-wrap:anywhere">${esc(s.type)}</span><span style="color:${s.error ? C.pink : s.count ? C.mint : "var(--muted)"};flex:none">${s.error ? "error" : s.count + (s.skipped ? ` · ${s.skipped} skipped` : "")}</span></div>${s.error ? `<p class="note" style="font-size:11px">${esc(s.error)}</p>` : ""}`).join("")}</div></div>` : ""}
    <p class="foot">Pulse reads your data with read-only access and keeps it on this phone. It isn't a medical device. Talk to a doctor about anything that worries you.</p>

function detail(id, sel = null) {
  const m = M[id], pts = series(id), vals = pts.map(p => p.value), a = avg(vals);
  const shown = sel != null ? pts[sel] : pts[pts.length - 1];
  const delta = shown && a ? (shown.value - a) / Math.abs(a) * 100 : null;
  document.getElementById("sheetBody").innerHTML = `
    <button class="back" id="closeSheet">${'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' + P.chev + "</svg>"}Back</button>
    <div class="stack" style="margin-top:10px">
      <div><div class="eyebrow">${m.title} · ${shown ? shown.date.toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" }) : "No data"}</div>
        <div class="detail-val" style="margin-top:8px;color:${m.tint}">${shown ? fmt(m, shown.value) : "—"}<small>${m.unit}</small></div>
        ${delta != null ? `<p class="note" style="margin-top:8px">${delta > 0 ? "+" : ""}${Math.round(delta)}% vs your ${pts.length}-day average</p>` : ""}
        ${shown?.note ? `<p class="note" style="margin-top:4px;color:var(--fg)">${esc(shown.note)}</p>` : ""}
        ${shown?.source ? `<p class="note" style="margin-top:4px">Recorded by ${esc(shown.source)}</p>` : ""}</div>
      ${pts.length ? `<div class="card">${dayChart(pts, m, sel)}<p class="note" style="margin-top:6px">Touch the chart to see any day.</p></div>
        <div class="card pills" style="margin:0">${pill("Average", fmt(m, a), m.tint)}${pill("Lowest", fmt(m, Math.min(...vals)))}${pill("Highest", fmt(m, Math.max(...vals)))}</div>` : ""}
      <div class="card">${title("About", "info", m.tint)}<p style="margin:0">${m.about}</p></div>
    </div>`;
  const sheet = document.getElementById("sheet");
  sheet.classList.add("open");
  document.getElementById("closeSheet").onclick = () => sheet.classList.remove("open");
  const hit = sheet.querySelector("[data-slots]");
  if (hit) {
    const pick = e => {
      const svg = hit.ownerSVGElement, r = svg.getBoundingClientRect(), pt = (e.touches ? e.touches[0] : e);
      const vx = (pt.clientX - r.left) / r.width * 340, i = Math.floor((vx - 4) / ((340 - 40) / pts.length));
      const idx = Math.max(0, Math.min(pts.length - 1, i));
      if (idx !== sel) detail(id, idx);
    };
    hit.addEventListener("pointerdown", pick);
    hit.addEventListener("pointermove", e => { if (e.buttons) pick(e); });
  }
}

function onboarding() {
  document.getElementById("tabs").hidden = true;
  const app = document.getElementById("app");
  app.innerHTML = `<div class="onboard">
    <div class="ringwrap" style="width:200px;height:200px">${ring(.78, [C.mint, C.sky, C.violet], 200, 18)}
      <div class="center"><svg class="heart" width="64" height="64" viewBox="0 0 24 24" fill="${C.pink}" style="filter:drop-shadow(0 0 14px ${C.pink})"><path d="${"M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-3 4.5 4.5 0 0 1 8 3c0 6-8 11-8 11z"}"/></svg></div></div>
    <div><h1>Pulse</h1><p>Everything your Fitbit Air knows about your body, in one beautiful place.</p></div>
    <div class="btnrow">
      ${canUseGoogle() ? `<button class="btn primary" id="connect">Connect Google Health</button>` : ""}
      <button class="btn ${canUseGoogle() ? "ghost" : "primary"}" id="demo">Explore with demo data</button>
    </div>
    ${S.error ? `<p class="warn">${esc(S.error)}</p>` : ""}
    <p class="note">Read-only. Your data stays on your phone.</p>

}

const TABS = [["today", "Today", "spark"], ["sleep", "Sleep", "moon"], ["heart", "Heart", "heart"], ["activity", "Activity", "run"], ["coach", "Claude", "claude"], ["you", "You", "user"]];
function render() {
  if (!S.data) return onboarding();
  const nav = document.getElementById("tabs"); nav.hidden = false;
  nav.querySelector(".inner").innerHTML = TABS.map(([id, label, ic]) => `<button class="tab" role="tab" aria-selected="${S.tab === id}" data-tab="${id}">${icon(ic)}${label}</button>`).join("");
  const app = document.getElementById("app");
  app.innerHTML = (({ today: todayScreen, sleep: sleepScreen, heart: heartScreen, activity: activityScreen, coach: coachScreen, you: youScreen })[S.tab] || todayScreen)();
  animateRings(app);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-metric],#syncBtn,#demo,#connect,#syncNow,#signOut");
  if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; store.set("pulse.tab", S.tab); render(); scrollTo(0, 0); }
  else if (t.dataset.metric) detail(t.dataset.metric);
  else if (t.id === "demo") { S.mode = "demo"; S.data = demo(); render(); }
  else if (t.id === "connect") connect();
  else if (t.id === "syncNow" || t.id === "syncBtn") S.mode === "live" ? sync() : (S.data = demo(), render());
  else if (t.id === "signOut") { store.set("pulse.token", null); S.mode = null; S.data = null; S.sources = []; render(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("sheet").classList.remove("open"); });

/* ---------- Google Health API (replaces the Fitbit Web API, which shuts off Nov 2, 2026) ---------- */
const API = "https://health.googleapis.com/v4";
const SCOPES = ["activity_and_fitness", "health_metrics_and_measurements", "sleep", "irn", "profile"]
  .map(s => `https://www.googleapis.com/auth/googlehealth.${s}.readonly`).join(" ");
function canUseGoogle() { return location.protocol === "https:" && !/claude\.ai|claudeusercontent|anthropic/.test(location.hostname) || location.hostname === "localhost"; }
function redirectUri() { return location.origin + location.pathname; }
function connect(silent) {

  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let t = a.getTime(); t <= z.getTime() + 180000; t += 5000) {
    const p = (t - a) / Math.max(z - a, 1);
    let b = t > z.getTime() ? target(k) - (t - z) / 1000 * .28 : target(Math.min(k * (.55 + p * 4), k + .12 * Math.sin(p * 14)));
    hr.push({ t: new Date(t), bpm: Math.max(h.rest + 5, b + (rnd() - .5) * 8) });
  }
  const mins = (z - a) / 60000;
  return analyse(sess, { hr, steps: ["Running", "Walking", "Hiking", "Football", "Basketball", "Tennis", "Padel", "Dance"].includes(sess.sport) ? Math.round(mins * (sess.sport === "Running" ? 160 : 95)) : null,
    km: sess.sport === "Running" ? mins / 5.8 : sess.sport === "Walking" || sess.sport === "Hiking" ? mins / 11 : sess.sport === "Cycling" ? mins / 2.6 : null,
    azm: null, kcal: mins * (4 + k * 9), kcalHow: "demo numbers" });
}

function sessionChart(r, start, end) {
  const pts = r.samples.map(s => ({ t: s.t, bpm: s.bpm })); if (pts.length < 2) return "";
  const Wd = 340, H = 190, L = 4, R = 32, T = 10, B = 22, t0 = start, t1 = Math.max(end + 180000, pts[pts.length - 1].t);
  const x = t => L + (Wd - L - R) * (t - t0) / (t1 - t0), h = r.profile;
  const lo = Math.min(h.rest, ...pts.map(p => p.bpm)) - 5, hi = Math.max(h.max * .95, ...pts.map(p => p.bpm)) + 5;
  const y = v => T + (H - B - T) * (1 - (v - lo) / (hi - lo));
  const thr = [.4, .6, .85].map(f => h.rest + (h.max - h.rest) * f);
  const bands = [[lo, thr[0], ZONES[0]], [thr[0], thr[1], ZONES[1]], [thr[1], thr[2], ZONES[2]], [thr[2], hi, ZONES[3]]];
  const xy = pts.map(p => [x(p.t), y(p.bpm)]);
  return `<svg class="chart" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Heart rate during the workout">
    ${bands.map(([a, b, z]) => `<rect x="${L}" y="${y(b)}" width="${Wd - L - R}" height="${Math.max(y(a) - y(b), 0)}" fill="${z.color}" fill-opacity=".07"/><text x="${Wd - R + 4}" y="${(y(a) + y(b)) / 2 + 3}" style="font-size:8.5px">${Math.round(a)}</text>`).join("")}
    <rect x="${x(end)}" y="${T}" width="${Wd - R - x(end)}" height="${H - B - T}" fill="#000" fill-opacity=".35"/>
    <text x="${x(end) + 4}" y="${T + 10}" style="font-size:9px">Recovery</text>
    <path d="${smooth(xy)}" fill="none" stroke="${C.mint}" stroke-width="2.2"/>
    <text x="${L}" y="${H - 6}">${time(new Date(start))}</text><text x="${x(end)}" y="${H - 6}" text-anchor="middle">${time(new Date(end))}</text></svg>`;
}
function summaryLine(r) {
  const top = ZONES.slice().sort((a, b) => r.zones[b.id] - r.zones[a.id])[0], pct = Math.round(r.max / r.profile.max * 100), parts = [];

}

/* --- lift tracker --- */
function liftHistory() { // per exercise, oldest first: [{date, sets, top, e1, vol}]
  const map = {};
  W.sessions().slice().reverse().forEach(s => {
    const by = {};
    (s.sets || []).forEach(x => (by[x.ex] = by[x.ex] || []).push(x));
    Object.entries(by).forEach(([ex, sets]) => {
      const top = sets.reduce((a, b) => e1rm(b.kg, b.reps) > e1rm(a.kg, a.reps) ? b : a);
      (map[ex] = map[ex] || []).push({ date: new Date(s.start), sessionId: s.id, sets, top, e1: e1rm(top.kg, top.reps), vol: sets.reduce((a, b) => a + b.kg * b.reps, 0) });
    });

}
function liftAdvice(ex, hist) {
  const h = hist[ex]; if (!h || !h.length) return null;
  const last = h[h.length - 1], prev = h[h.length - 2], step = LOWER.includes(ex) ? 5 : 2.5;
  const topKg = Math.max(...last.sets.map(s => s.kg)), atTop = last.sets.filter(s => s.kg === topKg);
  const ch = charge();
  if (ch != null && ch < 50) return { tone: "amber", text: `Recovery is ${ch}% today. Stay at ${topKg} kg or less and stop 2 reps short of failure.` };
  if (prev) {
    const pTop = Math.max(...prev.sets.map(s => s.kg));
    const pReps = Math.max(...prev.sets.filter(s => s.kg === pTop).map(s => s.reps)), lReps = Math.max(...atTop.map(s => s.reps));
    if (pTop === topKg && lReps < pReps - 1) return { tone: "amber", text: `Reps dropped at ${topKg} kg (${pReps} → ${lReps}). Hold the weight and recover before pushing.` };
  }
  if (atTop.length >= 2 && atTop.every(s => s.reps >= 8)) return { tone: "mint", text: `Ready to progress: try ${r05(topKg + step)} kg next time.` };

}

/* --- body battery: starts at your morning Charge, drains with every awake minute, faster in heart-rate zones --- */
function battery() {
  const ch = charge(); if (ch == null || !S.data) return null;
  const n = lastNight(), today0 = startOfDay(new Date());
  const wake = n && n.end > today0 - 6 * 3600000 ? n.end : today0;
  const hp = hrProfile(), hrr = Math.max(hp.max - hp.rest, 40);
  let lvl = ch, prev = +wake, used = 0;
  const pts = [[+wake, lvl]];
  for (const p of S.data.heart.filter(p => p.time > wake && p.time <= Date.now())) {
    const dt = Math.min((p.time - prev) / 60000, 15); prev = +p.time;
    const f = (p.bpm - hp.rest) / hrr;
    const rate = f < .15 ? .03 : f < .4 ? .07 : f < .6 ? .25 : f < .85 ? .5 : .9;
    const d = rate * dt; used += d; lvl = Math.max(5, lvl - d); pts.push([+p.time, lvl]);
  }
  const tail = Math.min((Date.now() - prev) / 60000, 60) * .03; lvl = Math.max(5, lvl - tail); pts.push([Date.now(), lvl]);
  return { now: Math.round(lvl), start: ch, pts, wake };
}
const batteryLabel = v => v >= 70 ? "Plenty left. Go hard today." : v >= 45 ? "Enough for a normal session." : v >= 25 ? "Running low. Keep it light." : "Empty. Rest and sleep early.";
function batteryCard() {
  const b = battery(); if (!b) return "";
  const col = b.now >= 45 ? C.mint : b.now >= 25 ? C.amber : "#ff1033";
  const Wd = 340, H = 64, t0 = b.pts[0][0], t1 = Math.max(Date.now(), t0 + 3600000), x = t => 2 + (Wd - 4) * (t - t0) / (t1 - t0), y = v => 4 + (H - 8) * (1 - v / 100);
  const line = smooth(b.pts.map(([t, v]) => [x(t), y(v)]));
  return `<div class="card">${title("Body battery", "bolt", col, `started at ${b.start}`)}
    <div class="battery"><div class="batt"><div class="fill" style="width:${b.now}%;background:${col}"></div></div><b style="color:${col}">${b.now}</b></div>
    <p style="margin:8px 0 0;font-weight:700">${batteryLabel(b.now)}</p>
    <svg class="chart" viewBox="0 0 ${Wd} ${H}" style="margin-top:8px" aria-hidden="true"><path d="${line}" fill="none" stroke="${col}" stroke-width="2"/></svg>
    <p class="note">Pulse's estimate. It starts each morning at your recovery score, drains slowly while you're awake and faster in your heart-rate zones.${(() => { const c = heartCoverage(b.wake); return c == null ? "" : c >= .8 ? ` Based on ${Math.round(c * 100)}% of today's heart data.` : ` <span style="color:${C.amber}">Only ${Math.round(c * 100)}% of today's heart data so far, so treat this as rough.</span>`; })()}</p></div>`;
}

/* --- sick early warning --- */
function sickCheck() {
  const out = [];
  const add = (id, label, test, show) => {
    const s = fullSeries(id); if (s.length < 5) return;
    const last = s[s.length - 1]; if (Date.now() - last.date > 2.5 * DAY) return;
    const base = median(s.slice(0, -1).map(p => p.value));
    out.push({ id, label, on: test(last.value, base), text: show(last.value, base) });
  };
  add("skinTemp", "Skin temperature", v => v >= .5, v => `${v > 0 ? "+" : ""}${v.toFixed(1)} °C vs your baseline`);
  add("restingHeartRate", "Resting heart rate", (v, b) => v - b >= 3, (v, b) => `${Math.round(v)} bpm (normal ${Math.round(b)})`);
  add("breathingRate", "Breathing rate", (v, b) => v - b >= 1, (v, b) => `${v.toFixed(1)} br/min (normal ${b.toFixed(1)})`);
  add("hrv", "HRV", (v, b) => v <= b * .85, (v, b) => `${Math.round(v)} ms (normal ${Math.round(b)})`);
  const n = out.filter(x => x.on).length;
  return { signals: out, count: n, level: n >= 3 ? "high" : n === 2 ? "watch" : "ok" };
}
function sickCard(always) {
  const c = sickCheck(); if (!c.signals.length || (!always && c.level === "ok")) return "";
  const col = c.level === "high" ? "#ff1033" : c.level === "watch" ? C.amber : C.mint;
  const head = c.level === "high" ? "Your body may be fighting something" : c.level === "watch" ? "Two warning signs last night" : "No signs of getting sick";
  const msg = c.level === "high" ? "Several signals moved together, which often shows up a day or two before you feel ill. Take a rest day, drink more and sleep early." : c.level === "watch" ? "Could be a hard session, alcohol or stress, or the start of a bug. Go easy today and see how tomorrow looks." : "Temperature, resting heart rate, breathing and HRV all look normal for you.";
  return `<div class="card" style="border-color:${col}66">${title("Body check", c.level === "ok" ? "shield" : "alert", col, c.level === "ok" ? "" : `${c.count} of ${c.signals.length} signals`)}
    <strong style="display:block;font-size:16px">${head}</strong><p class="note" style="margin:4px 0 12px;color:var(--fg);opacity:.8">${msg}</p>
    <div class="stack" style="gap:8px">${c.signals.map(s => `<div class="sigrow"><span class="sd" style="background:${s.on ? col : "rgba(255,255,255,.18)"}"></span><b>${s.label}</b><span>${s.text}</span></div>`).join("")}</div>
    <p class="note" style="margin-top:10px">Not a diagnosis. If you feel unwell or this lasts several days, see a doctor.</p></div>`;
}

/* --- weekly report card --- */
const letter = s => s == null ? "—" : (s >= 90 ? "A" : s >= 80 ? "B" : s >= 70 ? "C" : s >= 60 ? "D" : "F") + (s >= 60 && s < 100 && s % 10 >= 7 ? "+" : "");
function weekReport() {
  const rows = [], cut = startOfDay(new Date()) - 7 * DAY;
  const nights = mainNights().filter(n => n.end > cut);
  if (nights.length >= 3) { const sc = avg(nights.map(sleepScore)), hrs = avg(nights.map(n => n.asleep)) / 60;
    rows.push({ k: "Sleep", s: Math.round(sc), why: `${hrs.toFixed(1)} h a night on average, sleep score ${Math.round(sc)}.` }); }
  const zm = series("zoneMinutes").slice(-7).reduce((a, p) => a + p.value, 0), sessions = W.sessions().filter(s => s.start > cut).length + (S.data?.workouts || []).filter(w => w.start > cut).length;
  if (series("zoneMinutes").length) rows.push({ k: "Training", s: Math.round(Math.min(zm / 150, 1.05) * 95), why: `${Math.round(zm)} of 150 zone minutes, ${sessions} workouts.` });
  const hrv = series("hrv").map(p => p.value), rhr = series("restingHeartRate").map(p => p.value);
  if (hrv.length >= 10 && rhr.length >= 10) { const hp = (avg(hrv.slice(-7)) / avg(hrv.slice(-14, -7)) - 1) * 100, rd = avg(rhr.slice(-7)) - avg(rhr.slice(-14, -7));
    rows.push({ k: "Recovery", s: Math.round(clamp(85 + hp * 1.5 - rd * 6)), why: `HRV ${hp >= 0 ? "up" : "down"} ${Math.abs(hp).toFixed(0)}% and resting HR ${rd >= 0 ? "up" : "down"} ${Math.abs(rd).toFixed(1)} bpm vs the week before.` }); }
  if (nights.length >= 4) { const mins = nights.map(n => { const d = new Date(n.start); let m = d.getHours() * 60 + d.getMinutes(); if (m < 720) m += 1440; return m; });
    const mu = avg(mins), sd = Math.sqrt(avg(mins.map(m => (m - mu) ** 2)));
    rows.push({ k: "Consistency", s: Math.round(clamp(100 - Math.max(sd - 20, 0))), why: `Bedtime varied by about ${Math.round(sd)} minutes. Under 30 is ideal.` }); }
  const steps = series("steps").slice(-8, -1).map(p => p.value);
  if (steps.length >= 3) { const a = avg(steps); rows.push({ k: "Movement", s: Math.round(Math.min(a / 10000, 1.05) * 95), why: `${Math.round(a).toLocaleString()} steps a day on average.` }); }
  return { rows, overall: rows.length ? Math.round(avg(rows.map(r => r.s))) : null };
}

/* ---------- recovery: one score from HRV, resting HR, sleep, sleep debt, training strain and illness signs, each vs your own baseline ---------- */
const SLEEP_NEED = 480; // minutes; adjusted to his own average if he regularly sleeps well
const valOn = (id, t0) => { const p = fullSeries(id).find(p => p.date >= t0 && p.date < t0 + DAY); return p ? p.value : null; };

function sessionLoad(s) { return s.result?.status === "ready" ? s.result.load : (INTENSITY[s.sport] || .6) * (s.end - s.start) / 60000 * 1.5; }
function dayStrain(t0) { // zone minutes from the Air, weighted like training load, plus Pulse sessions not already in them
  const zm = valOn("zoneMinutes", t0) || 0;
  const ses = W.sessions().filter(s => s.end >= t0 && s.end < t0 + DAY);
  const fromSessions = ses.reduce((a, s) => a + sessionLoad(s), 0);

/* Recovery for the morning of day t0 (midnight). Uses only data you had by then. */
function recoveryAt(t0) {

  const add = (key, label, score, weight, detail) => parts.push({ key, label, score: Math.round(clamp(score)), weight, detail });
  // 1. HRV: log-scaled, compared with your normal spread (z-score), so a small dip on a steady baseline counts more than on a noisy one

    add("hrv", "HRV", 70 + z * 18, .3, `${Math.round(hv)} ms vs your normal ${Math.round(median(hb))} ms`);
  }

  const w = parts.reduce((a, p) => a + p.weight, 0);

function rawHeartSheet(hour) {

const COACH_SYSTEM = `You are Claude, built into Pulse, a personal health app that reads one person's Fitbit Air data. You are their health coach. They play padel and football, lift weights and do hydro physiotherapy, and they want honest, accurate guidance that helps them get healthier and perform better.

How to work:
- Use only the numbers in the data below. Never invent a reading. If something they ask about isn't in the data, say so in one line.
- Judge each number against their own 14-day baseline first, then against general norms. Name the actual numbers ("HRV 41 ms vs your 48 average").
- Fitbit Air has no ECG, GPS or stress sensor. Pulse Recovery and the sleep score are Pulse's own estimates. Totals for today are partial until the day ends.
- Training advice is concrete: what to do today, how hard (easy, moderate, hard, or a heart-rate range), and for how long.
- You are not a doctor and don't diagnose. If you see irregular-rhythm alerts, average SpO2 under 92%, resting heart rate 8+ bpm above baseline for 3+ days, or skin temperature 1 °C+ above baseline, say calmly that it's worth checking with a doctor, and why.
- If the data source says DEMO DATA, mention once, briefly, that these are sample numbers.
- Write like a good coach texting: warm, direct, short sentences, no filler. Use **bold** only for the key number or action. Use "- " for bullets and "## " for section headings. No tables.`;

const CHECKUP_ASK = `Give me today's checkup. Format:
First line: one punchy sentence on how my body is doing today (no heading).
## How you're doing
2 to 4 sentences covering recovery (sleep, HRV, resting HR, Pulse Recovery %) and activity, with the key numbers vs my baseline.
## Today's plan
3 bullets: training (what and how hard), recovery or sleep, and one small habit toward my goals.
## Watch
Only if something genuinely needs attention: 1 or 2 bullets. Otherwise leave this section out.
Keep it under 220 words.`;

function coachContext() { return `${COACH_SYSTEM}\n\nTheir data right now (JSON):\n${JSON.stringify(healthSummary())}`; }

/* One call to Claude. onText gets the whole answer so far. */
async function askClaude(messages, onText) {
  const be = coachBackend();
  if (be === "api") {
    const { default: Anthropic } = await import(SDK_URL);
    const client = new Anthropic({ apiKey: CO.key(), dangerouslyAllowBrowser: true });
    const stream = client.beta.messages.stream({
      model: COACH_MODEL, max_tokens: 16000,
      thinking: { type: "adaptive" }, output_config: { effort: "medium" },
      betas: ["server-side-fallback-2026-07-01"], fallbacks: "default", // if a safety check declines, the API retries on another model
      system: coachContext(), messages,
    });
    stream.on("text", (_, snapshot) => onText(snapshot));
    let msg;
    try { msg = await stream.finalMessage(); }
    catch (e) {
      const st = e?.status;
      throw new Error(st === 401 ? "Claude didn't accept that API key. Check it in the Claude coach settings below."
        : st === 429 ? "Too many requests right now. Try again in a minute."
        : st === 529 || st >= 500 ? "Claude is busy right now. Try again in a minute."
        : /credit balance/i.test(e?.message || "") ? "Your Anthropic account is out of credit. Add some at console.anthropic.com → Billing."
        : e?.message || "Couldn't reach Claude.");
    }
    if (msg.stop_reason === "refusal") throw new Error("Claude couldn't answer that one. Try asking another way.");
    return msg.content.filter(b => b.type === "text").map(b => b.text).join("");
  }
  if (be === "sample") {
    const input = messages.map((m, i) => ({ role: m.role, content: i === 0 ? `${coachContext()}\n\n---\n\n${m.content}` : m.content }));
    try { return (await CO.sample(input, { onText: ({ text }) => onText(text), cache: false })).text; }
    catch (e) {
      if (e?.code === "not_granted") { CO.sample = null; throw new Error("Claude wasn't allowed in this preview. Allow it from the page's permissions, or add an API key on Pulse's own web address."); }
      throw new Error(e?.code === "rate_limited" ? "Too many requests right now. Try again in a minute." : e?.message || "Couldn't reach Claude.");
    }
  }
  throw new Error("handoff");
}

/* Tiny, safe Markdown: headings, bullets, bold. */
function md(text) {
  const out = []; let list = false;
  for (const raw of String(text).split("\n")) {
    const line = esc(raw.trim()).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    if (/^[-•*] /.test(raw.trim())) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${line.slice(2)}</li>`); continue; }
    if (list) { out.push("</ul>"); list = false; }
    if (!line) continue;
    out.push(/^#{1,3} /.test(raw.trim()) ? `<h3>${line.replace(/^#{1,3} /, "")}</h3>` : `<p>${line}</p>`);
  }
  if (list) out.push("</ul>");
  return out.join("");
}

function paintLive() {

async function runCheckup() {

  const msgs = [...CO.chat(), { role: "user", content: q }];
  CO.saveChat(msgs); CO.busy = "chat"; CO.live = ""; CO.error = null;
  if (S.tab !== "coach") { S.tab = "coach"; store.set("pulse.tab", "coach"); }
  render(); scrollChat();
  try {
    const text = await askClaude(msgs.slice(-12), t => { CO.live = t; paintLive(); scrollChat(); });
    CO.saveChat([...msgs, { role: "assistant", content: text }]);
  } catch (e) { CO.error = e.message; CO.saveChat(msgs.slice(0, -1)); }
  CO.busy = null; CO.live = ""; render(); scrollChat();
}
const scrollChat = () => { const el = document.getElementById("chatEnd"); if (el) el.scrollIntoView({ block: "end", behavior: "smooth" }); };

/* No key and not in the preview: hand the summary to the Claude app. */
async function handoff(ask) {
  const prompt = `${COACH_SYSTEM}\n\nMy data right now (JSON):\n${JSON.stringify(healthSummary())}\n\n${ask}`;
  let copied = false;
  try { await navigator.clipboard.writeText(prompt); copied = true; } catch {}
  const url = "https://claude.ai/new" + (prompt.length < 6000 ? "?q=" + encodeURIComponent(prompt) : "");
  CO.error = copied ? (prompt.length < 6000 ? null : "Your data is copied. Paste it into the new Claude chat that just opened.") : "Couldn't copy automatically. Add an API key below to chat with Claude right here.";
  window.open(url, "_blank", "noopener");
  render();
}

/* Auto checkup: the first time you open Pulse each day with a key set, after your data syncs. */
function coachAuto() {
  if (S.mode === "live" && CO.key() && canUseGoogle() && !CO.checkup() && !CO.busy && S.data) runCheckup();
}

function checkupCard(compact) {
  const c = CO.checkup(), be = coachBackend();
  const headLine = c ? c.text.split("\n").find(l => l.trim()) || "" : "";
  if (compact) {
    if (CO.busy === "checkup") return `<button class="card tap coachcard" data-c="go" style="text-align:left;color:inherit;font:inherit">${title("Claude's checkup", "claude", C.mint, "reading…")}<p class="note thinking">Claude is reading last night and today…</p></button>`;
    return `<button class="card tap coachcard" data-c="${c ? "go" : "checkup"}" style="text-align:left;color:inherit;font:inherit">
      ${title("Claude's checkup", "claude", C.mint, c ? time(new Date(c.at)) : "")}
      ${c ? `<p class="coach-head">${md(headLine).replace(/<\/?(p|h3)>/g, "")}</p><p class="note" style="margin-top:6px">Tap for today's plan →</p>`
          : `<p style="margin:0">Get today's read on your recovery and a plan for the day.</p><p class="note" style="margin-top:6px">${be === "handoff" ? "Opens Claude with your data →" : "Tap to ask Claude →"}</p>`}
    </button>`;
  }
  let body;
  if (CO.busy === "checkup") body = `<div class="coach-md" data-live>${CO.live ? md(CO.live) : `<p class="note thinking">Claude is reading your data…</p>`}</div>`;
  else if (c) body = `<div class="coach-md">${md(c.text)}</div><div class="btnrow" style="margin-top:12px"><button class="btn ghost" data-c="checkup">${icon("sync")} Run again</button></div>`;
  else body = `<p style="margin:0 0 12px">Claude reads your sleep, heart, activity and workouts against your own baseline and tells you how you're doing and what to do today.</p>
    <button class="btn primary" data-c="checkup" style="width:100%">${be === "handoff" ? "Open in Claude with my data" : "Get today's checkup"}</button>`;
  return `<div class="card coachcard">${title("Today's checkup", "claude", C.mint, c ? `${time(new Date(c.at))}` : dateLine().split(",")[0])}${body}</div>`;
}

const QUICK = ["How should I train today?", "Am I recovering well this week?", "How can I sleep better?", "Plan my next 7 days of padel, football and lifting"];
function coachScreen() {
  const be = coachBackend(), msgs = CO.chat(), keyed = !!CO.key();
  return header("Claude", "Your coach") + `<div class="stack">
    ${CO.error ? `<div class="card warn">${esc(CO.error)}</div>` : ""}
    ${checkupCard(false)}
    <h2>Ask Claude</h2>
    <div class="chat">
      ${msgs.map(m => m.role === "user" ? `<div class="bubble me">${esc(m.content)}</div>` : `<div class="bubble ai coach-md">${md(m.content)}</div>`).join("")}
      ${CO.busy === "chat" ? `<div class="bubble ai coach-md" data-live>${CO.live ? md(CO.live) : `<p class="note thinking">Thinking…</p>`}</div>` : ""}
      ${!msgs.length && CO.busy !== "chat" ? `<div class="quick">${QUICK.map(q => `<button class="qchip" data-c="ask" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>` : ""}
      <div id="chatEnd"></div>
    </div>
    <form class="askbar" id="askForm"><input id="coachQ" placeholder="Ask about your sleep, heart, training…" autocomplete="off" ${CO.busy ? "disabled" : ""}><button class="iconbtn send" aria-label="Send" ${CO.busy ? "disabled" : ""}>${icon("send")}</button></form>
    ${msgs.length ? `<button class="btn ghost" data-c="clear" style="align-self:center">New conversation</button>` : ""}
    <div class="card">${title("Your goals", "spark", C.amber)}
      <p class="note" style="margin-bottom:10px">Claude shapes every checkup and answer around these.</p>
      <textarea id="coachGoals" class="goals" rows="3" placeholder="e.g. Drop 4 kg by March, sleep 7.5 h, more power in padel, finish hydro physio for my knee">${esc(CO.goals())}</textarea></div>
    ${canUseGoogle() ? `<div class="card">${title("Connect Claude", "link", C.sky, keyed ? "connected" : "")}
      <p class="note" style="margin-bottom:12px">${keyed ? "Claude runs right here in Pulse with your own key." : "Add your Anthropic API key to get your checkup automatically every morning and chat with Claude inside Pulse. Without it, Pulse opens the Claude app with your data instead."}</p>
      <label class="field" for="anthKey">Anthropic API key<input id="anthKey" type="password" value="${esc(CO.key())}" placeholder="sk-ant-…" autocomplete="off" spellcheck="false"></label>
      <div class="btnrow" style="margin-top:10px"><button class="btn primary" data-c="savekey">Save key</button>${keyed ? `<button class="btn ghost" data-c="dropkey">Remove</button>` : `<a class="btn ghost" href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">Get a key</a>`}</div></div>`
    : be === "sample" ? `<p class="note">In this preview Claude coaches you on the demo data through claude.ai. On Pulse's own web address it reads your real Fitbit Air data.</p>` : ""}
    <p class="foot">Claude sees a summary of your numbers (no name, no Google account) ${be === "api" ? "sent from this phone straight to Anthropic" : be === "sample" ? "through claude.ai" : "only when you open it in the Claude app"}. Claude is a coach, not a doctor.</p>
  </div>`;
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-c]"); if (!t) return;
  const a = t.dataset.c;
  if (a === "go") { S.tab = "coach"; store.set("pulse.tab", "coach"); render(); scrollTo(0, 0); }
  else if (a === "checkup") { if (S.tab !== "coach" && coachBackend() !== "handoff") { S.tab = "coach"; store.set("pulse.tab", "coach"); scrollTo(0, 0); } runCheckup(); }
  else if (a === "ask") sendChat(t.dataset.q);
  else if (a === "clear") { CO.saveChat([]); CO.error = null; render(); }
  else if (a === "savekey") { const k = document.getElementById("anthKey").value.trim(); store.set("pulse.anthropicKey", k || null); CO.error = null; render(); if (k) coachAuto(); }
  else if (a === "dropkey") { store.set("pulse.anthropicKey", null); render(); }
  else if (a === "debrief") {
    const s = W.sessions().find(x => x.id === t.dataset.id); if (!s) return;
    closeSheet();
    sendChat(`Debrief my ${s.sport} session from ${new Date(s.start).toLocaleString([], { weekday: "long", hour: "numeric", minute: "2-digit" })}: how did my body handle it, what does my recovery say, and what should I do before the next one?`);
  }
});
document.addEventListener("submit", e => { if (e.target.id !== "askForm") return; e.preventDefault(); const q = document.getElementById("coachQ").value; sendChat(q); });
document.addEventListener("change", e => { if (e.target.id === "coachGoals") store.set("pulse.goals", e.target.value.trim() || null); });
sampleChannel().then(ch => { if (ch && S.data) render(); });

/* ---------- boot ---------- */
S.tab = store.get("pulse.tab") || "today";
if (canUseGoogle()) readRedirect();
if (canUseGoogle() && (token() || (store.get("pulse.consented") && store.get("pulse.clientId") && !S.error))) { S.mode = "live"; sync(); render(); }
else if (canUseGoogle()) render();
else { S.mode = "demo"; S.data = demo(); render(); }
})();
</script>

</body></html>
