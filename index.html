<style>
/* Layout: phone-first app shell. Glass cards over a drifting aurora, fixed tab bar at the bottom, detail sheets slide up. */
:root {
  --bg: #050304;
  --surface: rgba(255,228,232,0.045);
  --surface-strong: rgba(255,228,232,0.085);
  --line: rgba(255,90,110,0.16);
  --fg: #fbf2f3;
  --muted: rgba(246,214,219,0.58);
  --mint: #ff2e45;
  --pink: #ff5a6e;
  --violet: #d8233c;
  --amber: #ff8a3d;
  --sky: #ff9aa6;
  --lime: #ffc9cf;
  --deep: #9c1430;
  --display: "Unbounded", "Avenir Next", system-ui, sans-serif;
  --body: "Manrope", "SF Pro Text", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; min-height: 100vh; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }

.aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.aurora i { position: absolute; border-radius: 50%; filter: blur(100px); opacity: .30; animation: drift 18s ease-in-out infinite alternate; }
.aurora i:nth-child(1) { width: 440px; height: 440px; background: #b0102a; left: -160px; top: -180px; }
.aurora i:nth-child(2) { width: 380px; height: 380px; background: #ff2e45; right: -170px; top: 120px; opacity: .14; animation-duration: 22s; }
.aurora i:nth-child(3) { width: 420px; height: 420px; background: #5e0815; left: -120px; bottom: -200px; opacity: .5; animation-duration: 26s; }
@keyframes drift { to { transform: translate(60px, 50px) scale(1.12); } }

.app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px)); }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px 14px; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: -.01em; margin: 2px 0 0; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 600; font-size: 17px; margin: 10px 2px 0; }
.chip { font-size: 10px; font-weight: 800; letter-spacing: .12em; padding: 5px 9px; border-radius: 99px; background: rgba(255,138,61,.16); color: var(--amber); }
.chip.live { background: rgba(255,46,69,.16); color: var(--mint); }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: grid; place-items: center; cursor: pointer; }
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.stack { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 18px;
  backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%); min-width: 0; }
.card.tap { cursor: pointer; transition: transform .15s ease, background .15s; }
.card.tap:active { transform: scale(.98); background: var(--surface-strong); }
.card-title { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.card-title .dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; }
.card-title .dot svg { width: 13px; height: 13px; }
.card-title .end { margin-left: auto; letter-spacing: 0; text-transform: none; font-weight: 600; }

.hero { display: flex; gap: 18px; align-items: center; }
.ringwrap { position: relative; flex: none; }
.ringwrap .center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.big { font-family: var(--display); font-weight: 800; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.sub { font-size: 10px; font-weight: 800; letter-spacing: .2em; color: var(--muted); margin-top: 4px; }
.hero-copy strong { display: block; font-size: 17px; line-height: 1.3; margin-bottom: 6px; }
.hero-copy p { margin: 0; font-size: 12.5px; color: var(--muted); }

.pills { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 10px; margin-top: 16px; }
.pill b { display: block; font-family: var(--display); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.pill span { font-size: 11px; color: var(--muted); }

.rings-row { display: flex; gap: 18px; align-items: center; }
.legend { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.legend .row { display: flex; gap: 10px; align-items: center; }
.legend .sw { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.legend b { font-family: var(--display); font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.legend small { display: block; color: var(--muted); font-size: 11px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2 > :last-child:nth-child(odd) { grid-column: span 2; }
.tile { padding: 14px; border-radius: 22px; display: flex; flex-direction: column; gap: 6px; }
.tile .head { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; }
.tile .head svg { width: 14px; height: 14px; flex: none; }
.tile .val { font-family: var(--display); font-weight: 700; font-size: 21px; font-variant-numeric: tabular-nums; }
.tile .val small { font-family: var(--body); font-size: 11px; font-weight: 600; color: var(--muted); margin-left: 3px; }
.tile svg.spark { width: 100%; height: 34px; display: block; }

svg text { font-family: var(--body); fill: var(--muted); font-size: 10px; }
.chart { width: 100%; display: block; }

.bar-row { display: grid; grid-template-columns: 48px 1fr 60px; gap: 10px; align-items: center; font-size: 12px; font-weight: 700; }
.bar-row .track { height: 8px; border-radius: 9px; background: rgba(255,255,255,.07); overflow: hidden; }
.bar-row .fill { height: 100%; border-radius: 9px; }
.bar-row .t { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }

.status { display: flex; gap: 14px; align-items: center; }
.status .badge { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.status .badge svg { width: 22px; height: 22px; }
.status strong { display: block; font-size: 15.5px; }
.status p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }

.workout { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 22px; }
.workout .ic { width: 46px; height: 46px; border-radius: 14px; background: rgba(255,46,69,.14); color: var(--mint); display: grid; place-items: center; flex: none; }
.workout .ic svg { width: 22px; height: 22px; }
.workout .mid { flex: 1; min-width: 0; }
.workout .mid b { display: block; }
.workout .mid span, .workout .end span { font-size: 11.5px; color: var(--muted); }
.workout .end { text-align: right; }
.workout .end b { font-family: var(--display); font-size: 14px; display: block; }

.caps { display: flex; flex-direction: column; gap: 12px; }
.cap { display: flex; gap: 12px; }
.cap svg { width: 18px; height: 18px; color: var(--mint); flex: none; margin-top: 2px; }
.cap b { display: block; font-size: 14px; }
.cap span { font-size: 12px; color: var(--muted); }

.btn { appearance: none; border: 0; border-radius: 99px; padding: 14px 20px; font: 700 15px var(--body); cursor: pointer; }
.btn.primary { background: linear-gradient(135deg, #ff3b52, #c20f2b); color: #fff; box-shadow: 0 8px 30px rgba(255,46,69,.35); }
.btn.ghost { background: var(--surface-strong); color: var(--fg); border: 1px solid var(--line); }
.btn:focus-visible, .iconbtn:focus-visible, .tab:focus-visible, .card.tap:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
label.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
label.field input { font: 500 13px var(--mono); color: var(--fg); background: rgba(0,0,0,.5); border: 1px solid var(--line); border-radius: 14px; padding: 12px; width: 100%; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.warn { color: var(--amber); font-size: 12.5px; }
.foot { text-align: center; font-size: 11.5px; color: var(--muted); margin: 6px 0 0; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 8px max(10px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  background: rgba(6,3,4,.78); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border-top: 1px solid var(--line); }
nav.tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); }
.tab { appearance: none; background: none; border: 0; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; font: 700 10.5px var(--body); padding: 6px 0; cursor: pointer; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--mint); }

.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; transform: translateY(100%); transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.sheet.open { transform: none; }
.sheet .app { padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--mint); background: none; border: 0; font: 700 15px var(--body); padding: 6px 0; cursor: pointer; }
.detail-val { font-family: var(--display); font-weight: 800; font-size: 56px; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.detail-val small { font-family: var(--body); font-size: 18px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 6px; }

.onboard { min-height: calc(100vh - 40px); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 22px; }
.onboard .heart { animation: beat 1.1s ease-in-out infinite; transform-origin: center; }
@keyframes beat { 0%,100% { transform: scale(.94); } 15% { transform: scale(1.1); } 30% { transform: scale(.98); } 45% { transform: scale(1.06); } }
.onboard h1 { font-size: 44px; font-weight: 800; }
.onboard p { color: var(--muted); max-width: 30ch; margin: 0 auto; }
.onboard .btnrow { flex-direction: column; width: 100%; max-width: 340px; }

.sports { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.sport { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 20px; padding: 14px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; font: 700 12.5px var(--body); cursor: pointer; }
.sport svg { width: 26px; height: 26px; color: var(--mint); }
.sport.on { background: linear-gradient(160deg, rgba(255,46,69,.35), rgba(120,10,28,.35)); border-color: var(--mint); }
.btn[disabled] { opacity: .45; }
.btn svg { width: 16px; height: 16px; vertical-align: -3px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
label.field select { font: 500 13px var(--body); color: var(--fg); background: rgba(0,0,0,.5); border: 1px solid var(--line); border-radius: 14px; padding: 12px 8px; width: 100%; }
.live { text-align: center; padding-top: 20px; }
.arc.breathe { animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) {
  .arc.breathe { animation: none; }
  .aurora i, .onboard .heart, .iconbtn.spin svg { animation: none; }
  .sheet { transition: none; }
}
.coachcard { border-color: rgba(255,46,69,.38); background: linear-gradient(160deg, rgba(255,46,69,.10), rgba(255,228,232,.035) 55%); }
.coach-head { margin: 0; font-size: 16.5px; font-weight: 700; line-height: 1.35; }
.coach-md p { margin: 0 0 8px; }
.coach-md h3 { font: 700 11px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--mint); margin: 14px 0 6px; }
.coach-md h3:first-child { margin-top: 0; }
.coach-md ul { margin: 0 0 8px; padding-left: 18px; }
.coach-md li { margin: 0 0 5px; }
.coach-md li::marker { color: var(--mint); }
.coach-md > :last-child { margin-bottom: 0; }
.thinking { animation: breathe 1.6s ease-in-out infinite; }
.chat { display: flex; flex-direction: column; gap: 10px; }
.bubble { max-width: 88%; padding: 12px 14px; border-radius: 20px; font-size: 14.5px; overflow-wrap: anywhere; }
.bubble.me { align-self: flex-end; background: linear-gradient(135deg, #ff3b52, #c20f2b); color: #fff; border-bottom-right-radius: 6px; white-space: pre-wrap; }
.bubble.ai { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; }
.qchip { appearance: none; border: 1px solid var(--line); background: var(--surface-strong); color: var(--fg); border-radius: 99px; padding: 9px 13px; font: 600 13px var(--body); text-align: left; cursor: pointer; }
.askbar { display: flex; gap: 8px; align-items: center; }
.askbar input, textarea.goals { flex: 1; min-width: 0; font: 500 16px var(--body); color: var(--fg); background: rgba(0,0,0,.5); border: 1px solid var(--line); border-radius: 22px; padding: 12px 16px; }
textarea.goals { width: 100%; border-radius: 16px; resize: vertical; font-size: 16px; }
.iconbtn.send { width: 46px; height: 46px; flex: none; background: linear-gradient(135deg, #ff3b52, #c20f2b); border: 0; color: #fff; }
.iconbtn[disabled], .askbar input[disabled] { opacity: .5; }
a.btn { text-decoration: none; display: inline-block; }
@media (prefers-reduced-motion: reduce) { .thinking { animation: none; } }
.quickrow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.meal { border-top: 1px solid var(--line); padding: 10px 0 4px; }
.mealhead { display: flex; align-items: center; gap: 10px; }
.mcheck { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: none; color: #fff; font: 800 15px var(--body); display: grid; place-items: center; cursor: pointer; padding: 0; }
.mcheck.on { background: var(--mint); border-color: var(--mint); }
.mcheck.part { border-color: var(--mint); color: var(--mint); }
.mcheck.sm { width: 24px; height: 24px; font-size: 13px; }
.mealname { flex: 1; min-width: 0; background: none; border: 0; color: inherit; text-align: left; font: inherit; padding: 4px 0; cursor: pointer; display: flex; flex-direction: column; }
.mealname b { font: 700 15px var(--body); }
.mealname span { font-size: 12px; color: var(--muted); }
.meal.done .mealname b { color: var(--muted); text-decoration: line-through; }
.mealchev { flex: none; width: 32px; height: 32px; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 6px; }
.mealchev svg { width: 18px; height: 18px; }
.mealitems { display: flex; flex-direction: column; gap: 4px; margin: 6px 0 4px 40px; }
.mitem { display: flex; align-items: center; gap: 10px; background: var(--surface-strong); border: 1px solid var(--line); border-radius: 14px; padding: 9px 10px; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.mitem.on { opacity: .6; }
.mi-name { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; display: flex; flex-direction: column; }
.mi-name small { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.mi-mac { flex: none; font: 600 10.5px var(--mono); color: var(--muted); }
.mlabel { font: 700 11px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
.mchips { display: flex; flex-wrap: wrap; gap: 6px; }
.mchip { border: 1px solid var(--line); border-radius: 99px; padding: 5px 10px; font: 600 12px var(--body); color: var(--muted); }
.mchip.on { background: rgba(255,46,69,.16); border-color: rgba(255,46,69,.5); color: var(--fg); }
.mlist { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.5; }
.mlist li { margin: 3px 0; }
.ibgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ibtile { background: var(--surface-strong); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ibtile span { font-size: 12px; color: var(--muted); }
.ibtile b { font: 700 20px var(--display, var(--body)); }
.ibtile .spark { width: 100%; height: 26px; margin-top: 4px; }
.mlist li::marker { color: var(--mint); }
.mwarn { margin: 10px 0 0; font-size: 13px; color: #ffb38a; display: flex; gap: 6px; align-items: flex-start; }
.mwarn svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.mfocus .note svg { width: 14px; height: 14px; vertical-align: -2px; color: var(--amber, #ff8a3d); }
.qchip.on { background: rgba(255,46,69,.2); border-color: var(--mint); }
.qbtn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 18px; padding: 12px 2px 10px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font: inherit; cursor: pointer; transition: transform .12s; }
.qbtn svg { width: 28px; height: 28px; color: var(--mint); margin-bottom: 2px; }
.qbtn b { font: 700 13.5px var(--body); }
.qbtn span { font-size: 10.5px; text-align: center; color: var(--muted); }
.qbtn:active { transform: scale(.96); background: var(--surface-strong); }
.qbtn:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
.setform { display: grid; grid-template-columns: 1fr 64px 64px 46px; gap: 8px; align-items: center; }
.setform select, .setform input { font: 500 16px var(--body); color: var(--fg); background: rgba(0,0,0,.5); border: 1px solid var(--line); border-radius: 14px; padding: 11px 8px; width: 100%; min-width: 0; }
.exgroup { margin-top: 12px; }
.exhead { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.exhead b { font-size: 14.5px; } .exhead span { font-size: 11.5px; color: var(--muted); }
.setchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.setchip { appearance: none; border: 1px solid var(--line); background: var(--surface-strong); color: var(--fg); border-radius: 10px; padding: 6px 10px; font: 600 13px var(--mono); cursor: pointer; }
.liftrow { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.liftrow .lt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.liftrow .lt span { font-size: 12px; color: var(--muted); } .liftrow .lt em { font-style: normal; font-weight: 700; }
.liftrow .spark { width: 90px; height: 30px; flex: none; }
.painpick { margin-top: 10px; }
.painrow { display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; margin-top: 6px; }
.pchip { appearance: none; border: 1px solid var(--line); background: var(--surface-strong); color: var(--fg); border-radius: 9px; padding: 8px 0; font: 700 13px var(--body); cursor: pointer; min-width: 0; }
.pchip.on { background: hsl(calc(130 - var(--h) * 1.3) 75% 45%); border-color: transparent; color: #fff; }
.battery { display: flex; align-items: center; gap: 12px; }
.batt { flex: 1; height: 22px; border-radius: 8px; border: 2px solid rgba(255,255,255,.25); padding: 2px; position: relative; }
.batt::after { content: ""; position: absolute; right: -7px; top: 5px; width: 4px; height: 8px; border-radius: 0 2px 2px 0; background: rgba(255,255,255,.25); }
.batt .fill { height: 100%; border-radius: 4px; }
.battery b { font: 700 28px var(--display); font-variant-numeric: tabular-nums; min-width: 2.2ch; text-align: right; }
.sigrow { display: grid; grid-template-columns: 10px auto 1fr; gap: 10px; align-items: center; font-size: 13px; }
.sigrow span:last-child { color: var(--muted); text-align: right; font-size: 12px; }
.sigrow .sd { width: 10px; height: 10px; border-radius: 50%; }
.report { display: flex; gap: 18px; align-items: center; }
.bigletter { font: 800 56px var(--display); line-height: 1; min-width: 1.6ch; text-align: center; }

<script>
(() => {

/* ---------- icons ---------- */

const C = { mint: "#ff2e45", pink: "#ff5a6e", violet: "#d8233c", amber: "#ff8a3d", sky: "#ff9aa6", lime: "#ffc9cf", deep: "#9c1430" };

const METRICS = [

const M = Object.fromEntries(METRICS.map(m => [m.id, m]));
const fmt = (m, v) => {

  const s = v.toLocaleString(undefined, { minimumFractionDigits: m.dec, maximumFractionDigits: m.dec });

const STAGES = [
  { id: "deep", label: "Deep", color: C.deep },
  { id: "light", label: "Light", color: C.violet },
  { id: "rem", label: "REM", color: C.sky },
  { id: "awake", label: "Awake", color: C.amber },
];
const stageOf = raw => {

  if (v.includes("REM")) return "rem";
  if (v.includes("WAKE") || v.includes("RESTLESS") || v.includes("OUT")) return "awake";

};

/* ---------- state ---------- */
const DAY = 86400000;
const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const isToday = d => startOfDay(d).getTime() === startOfDay(new Date()).getTime();
const memory = new Map(); // fallback when the browser blocks storage
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v ?? memory.get(k) ?? null; } catch { return memory.get(k) ?? null; } },

};
const S = { mode: null, tab: "today", data: null, syncing: false, error: null, sources: [] };
const HISTORY = 14;   // days shown in charts
const BASE_DAYS = 30; // days fetched, so your personal baselines are steadier

/* ---------- demo data ---------- */
function demo() {
  let seed = 42;
  const rnd = (a, b) => { seed = (seed * 1103515245 + 12345) % 2147483648; return a + (b - a) * (seed / 2147483648); };
  const today = startOfDay(new Date());
  const days = [...Array(HISTORY)].map((_, i) => new Date(today.getTime() - (HISTORY - 1 - i) * DAY));
  const frac = Math.min(Math.max((Date.now() - today) / DAY, .25), 1);
  const ser = f => days.map((d, i) => ({ date: d, value: f(i, i === HISTORY - 1) }));
  const daily = {
    steps: ser((i, t) => (t ? frac : 1) * rnd(6500, 13500)),
    calories: ser((i, t) => (t ? frac : 1) * rnd(2050, 2850)),
    zoneMinutes: ser((i, t) => (t ? frac : 1) * rnd(8, 48)),
    activeMinutes: ser((i, t) => (t ? frac : 1) * rnd(18, 75)),
    vo2Max: ser(i => 44.2 + i * .05),
    avgHeartRate: ser(() => rnd(68, 79)),
    restingHeartRate: ser(i => 58 - i * .08 + rnd(-1.5, 1.5)),
    hrv: ser((i, t) => 46 + Math.sin(i / 2) * 6 + rnd(-3, 3) + (t ? 6 : 0)),
    spo2: ser(() => rnd(95.4, 97.8)),
    breathingRate: ser(() => rnd(13.6, 15.4)),
    skinTemp: ser(() => rnd(-.5, .5)),
  };
  daily.distance = daily.steps.map(p => ({ date: p.date, value: p.value * .00074 }));
  daily.spo2.forEach(p => { p.note = `Overnight range ${(p.value - 1.6).toFixed(1)}–${Math.min(p.value + 1.4, 100).toFixed(1)}%`; });
  daily.skinTemp.forEach(p => { p.note = `Nightly ${(33.9 + p.value).toFixed(2)} °C vs your baseline 33.90 °C`; });
  daily.vo2Max.forEach(p => { p.note = "Cardio fitness level: good"; });
  Object.values(daily).forEach(list => list.forEach(p => { p.source = "Fitbit Air (demo)"; }));

  const heart = [];
  for (let t = today.getTime(); t < Date.now(); t += 300000) {
    const d = new Date(t), h = d.getHours() + d.getMinutes() / 60;
    let b = h < 6.5 ? 54 + rnd(-3, 3) : h >= 7 && h < 7.75 ? 128 + rnd(-12, 20) : h >= 12 && h < 13 ? 88 + rnd(-6, 10) : h >= 17.5 && h < 18.25 ? 142 + rnd(-14, 18) : 72 + rnd(-8, 14);
    heart.push({ time: d, bpm: b });
  }

  const pattern = [["awake",4,12],["light",15,30],["deep",30,55],["light",20,35],["rem",12,22],["light",25,40],["deep",15,35],["light",20,30],["rem",20,30],["awake",2,6],["light",25,40],["rem",25,40],["light",20,40],["awake",2,8],["rem",20,35],["light",15,60]];
  const nights = days.map(d => {
    const end = new Date(d.getTime() + rnd(6.4, 7.6) * 3600000);
    const start = new Date(end.getTime() - rnd(6.6, 8.4) * 3600000);
    const stages = []; let cur = start.getTime();
    for (const [k, lo, hi] of pattern) {
      if (cur >= end.getTime()) break;
      const e = Math.min(cur + rnd(lo, hi) * 60000, end.getTime());
      stages.push({ kind: k, start: new Date(cur), end: new Date(e) }); cur = e;
    }
    return nightFrom(start, end, stages, null, true);
  });

  const types = ["Run", "Strength training", "Walk", "Outdoor bike", "HIIT", "Run"];
  const workouts = types.map((type, i) => {
    const start = new Date(today.getTime() - i * 2 * DAY + rnd(7, 18.5) * 3600000);
    const min = rnd(25, 65);
    return { type, start, end: new Date(start.getTime() + min * 60000), calories: min * rnd(7, 11), hr: rnd(118, 156),
      km: type === "Run" ? min / 5.6 : type === "Outdoor bike" ? min / 2.4 : null };
  });
  const heartRaw = []; // demo: a reading every 5 seconds, wobbling around the 5-minute values
  heart.forEach((p, i) => { for (let k = 0; k < 60; k++) { const t = new Date(p.time.getTime() + k * 5000); if (t > Date.now()) break; heartRaw.push({ t, bpm: p.bpm + Math.sin((i * 60 + k) / 7) * 3 + rnd(-2, 2) }); } });
  return { daily, heart, heartRaw, nights, workouts, alerts: [], lastSync: new Date() };
}

function nightFrom(start, end, stages, summary, main) {
  const sum = k => stages.filter(s => k(s.kind)).reduce((a, s) => a + (s.end - s.start) / 60000, 0);
  const asleep = summary?.minutesAsleep ?? sum(k => k !== "awake");
  const awake = summary?.minutesAwake ?? sum(k => k === "awake");
  return { start, end, stages, asleep, awake, inBed: (end - start) / 60000, main,
    minutes: kinds => sum(k => kinds.includes(k)) };
}

/* ---------- scores (Pulse's own) ---------- */
function sleepScore(n) {
  const dur = Math.min(n.asleep / 480, 1) * 50;
  const rest = n.stages.length ? Math.min(n.minutes(["deep", "rem"]) / Math.max(n.asleep, 1) / .4, 1) * 25 : 18;
  const eff = Math.min(Math.max((n.asleep / Math.max(n.inBed, 1) - .75) / .2, 0), 1) * 25;
  return Math.round(dur + rest + eff);
}
const fullSeries = id => S.data?.daily[id] || [];
const series = id => fullSeries(id).slice(-HISTORY);
const median = vals => { if (!vals.length) return null; const v = [...vals].sort((a, b) => a - b), m = v.length >> 1; return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2; };
const fresh = (p, hours = 36) => !!p && Date.now() - p.date < hours * 3600000; // a daily value counts only if it's from last night / today
const latest = id => { const s = series(id); return s.length ? s[s.length - 1] : null; };
const todayVal = id => { const l = latest(id); return l && isToday(l.date) ? l.value : null; };
const avg = (vals) => vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
const baseline = id => median(fullSeries(id).slice(0, -1).map(p => p.value)); // median ignores one-off odd days
const mainNights = () => (S.data?.nights || []).filter(n => n.main).sort((a, b) => a.end - b.end);
const lastNight = () => mainNights().slice(-1)[0] || null;
const clamp = v => Math.min(Math.max(v, 0), 100);
function charge() {
  const parts = [];
  // Only last night's data counts. An old night or a missing HRV reading is left out rather than reused.
  const n = lastNight(); if (n && Date.now() - n.end < 20 * 3600000) parts.push([sleepScore(n), .4]);
  const h = fresh(latest("hrv")) ? latest("hrv") : null, hb = baseline("hrv"); if (h && hb) parts.push([clamp(70 + (h.value / hb - 1) * 200), .35]);
  const r = fresh(latest("restingHeartRate")) ? latest("restingHeartRate") : null, rb = baseline("restingHeartRate"); if (r && rb) parts.push([clamp(70 - (r.value - rb) * 6), .25]);
  if (!parts.length) return null;
  return Math.round(parts.reduce((a, [s, w]) => a + s * w, 0) / parts.reduce((a, [, w]) => a + w, 0));
}
const chargeLabel = s => s >= 80 ? "Recovered. Go hard today." : s >= 60 ? "Mostly recovered. A solid training day." : s >= 40 ? "Still recovering. Keep it light." : "Not recovered. Rest today.";

/* ---------- drawing ---------- */
let uid = 0;
function ring(progress, colors, size, stroke) {
  const id = "g" + (++uid), r = (size - stroke) / 2 - 6, c = size / 2, len = 2 * Math.PI * r;
  const p = Math.max(0, Math.min(progress || 0, 1));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">${colors.map((col, i) => `<stop offset="${i / Math.max(colors.length - 1, 1)}" stop-color="${col}"/>`).join("")}</linearGradient>
    <filter id="${id}f" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter></defs>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${colors[0]}" stroke-opacity=".14" stroke-width="${stroke}"/>
    <g transform="rotate(-90 ${c} ${c})">
      <circle class="arc" cx="${c}" cy="${c}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${len}" stroke-dashoffset="${len}" data-to="${len * (1 - p)}" filter="url(#${id}f)" opacity=".7"/>
      <circle class="arc" cx="${c}" cy="${c}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${len}" stroke-dashoffset="${len}" data-to="${len * (1 - p)}"/>
    </g></svg>`;
}
function animateRings(root) {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  root.querySelectorAll(".arc").forEach(a => {
    if (reduce) { a.style.strokeDashoffset = a.dataset.to; return; }
    a.style.transition = "stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)";
    requestAnimationFrame(() => requestAnimationFrame(() => { a.style.strokeDashoffset = a.dataset.to; }));
  });
}
function scaleY(vals, h, pad, zero) {
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (zero) lo = 0;
  if (hi === lo) { hi += 1; lo -= zero ? 0 : 1; }
  const span = hi - lo; if (!zero) { lo -= span * .15; hi += span * .15; }
  return { y: v => pad + (h - 2 * pad) * (1 - (v - lo) / (hi - lo)), lo, hi };
}
function smooth(pts) {
  if (pts.length < 2) return pts.length ? `M${pts[0][0]},${pts[0][1]}` : "";
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += ` C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`;
  }
  return d;
}
function spark(pts, color, bars) {
  const W = 150, H = 34, id = "s" + (++uid);
  if (!pts.length) return "";
  const vals = pts.map(p => p.value), s = scaleY(vals, H, 2, bars);
  if (bars) {
    const bw = W / pts.length;
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${pts.map((p, i) =>
      `<rect x="${i * bw + 1.5}" y="${s.y(p.value)}" width="${Math.max(bw - 3, 1)}" height="${Math.max(H - 2 - s.y(p.value), 1)}" rx="1.5" fill="${color}" fill-opacity="${i === pts.length - 1 ? 1 : .55}"/>`).join("")}</svg>`;
  }
  const xy = pts.map((p, i) => [i / Math.max(pts.length - 1, 1) * (W - 4) + 2, s.y(p.value)]);
  const line = smooth(xy);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${line} L${xy[xy.length - 1][0]},${H} L${xy[0][0]},${H} Z" fill="url(#${id})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function hrChart(samples, H = 150) {
  const W = 340, L = 4, R = 30, T = 10, B = 22, id = "h" + (++uid);
  if (samples.length < 2) return "";
  const t0 = startOfDay(samples[0].time).getTime(), t1 = t0 + DAY;
  const x = t => L + (W - L - R) * (t - t0) / (t1 - t0);
  const s = scaleY(samples.map(p => p.bpm), H - B, T, false);
  const xy = samples.map(p => [x(p.time.getTime()), s.y(p.bpm)]);
  const line = smooth(xy);
  const ticks = [s.lo + (s.hi - s.lo) * .2, (s.lo + s.hi) / 2, s.lo + (s.hi - s.lo) * .8].map(Math.round);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Heart rate today">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.pink}" stop-opacity=".45"/><stop offset="1" stop-color="${C.pink}" stop-opacity="0"/></linearGradient>
    <linearGradient id="${id}l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.amber}"/><stop offset="1" stop-color="${C.pink}"/></linearGradient></defs>
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${s.y(v)}" y2="${s.y(v)}" stroke="#ffd6dc" stroke-opacity=".07"/><text x="${W - R + 6}" y="${s.y(v) + 3}">${v}</text>`).join("")}
    ${[0, 6, 12, 18].map(h => `<text x="${x(t0 + h * 3600000)}" y="${H - 6}">${h === 0 ? "12a" : h === 12 ? "12p" : h > 12 ? (h - 12) + "p" : h + "a"}</text>`).join("")}
    <path d="${line} L${xy[xy.length - 1][0]},${H - B} L${xy[0][0]},${H - B} Z" fill="url(#${id})"/>
    <path d="${line}" fill="none" stroke="url(#${id}l)" stroke-width="2"/>
    <circle cx="${xy[xy.length - 1][0]}" cy="${xy[xy.length - 1][1]}" r="4" fill="${C.pink}" stroke="#fff" stroke-width="1.5"/></svg>`;
}
function hypnogram(n) {
  const W = 340, H = 150, L = 46, R = 6, B = 22, rowH = (H - B) / 4;
  const t0 = n.start.getTime(), t1 = n.end.getTime(), x = t => L + (W - L - R) * (t - t0) / (t1 - t0);
  const rows = ["awake", "rem", "light", "deep"];
  const ticks = []; const first = new Date(t0); first.setMinutes(0, 0, 0);
  for (let t = first.getTime() + 3600000; t < t1; t += 2 * 3600000) ticks.push(t);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sleep stages">
    ${rows.map((k, i) => `<text x="0" y="${i * rowH + rowH / 2 + 3}">${STAGES.find(s => s.id === k).label}</text><line x1="${L}" x2="${W - R}" y1="${i * rowH + rowH / 2}" y2="${i * rowH + rowH / 2}" stroke="#fff" stroke-opacity=".05"/>`).join("")}
    ${n.stages.map(s => { const i = rows.indexOf(s.kind), col = STAGES.find(z => z.id === s.kind).color;
      return `<rect x="${x(s.start)}" y="${i * rowH + rowH / 2 - 9}" width="${Math.max(x(s.end) - x(s.start), 1.5)}" height="18" rx="4" fill="${col}"/>`; }).join("")}
    ${ticks.map(t => `<text x="${x(t)}" y="${H - 6}" text-anchor="middle">${new Date(t).toLocaleTimeString([], { hour: "numeric" })}</text>`).join("")}</svg>`;
}
function dayChart(pts, m, sel, H = 230) {
  const W = 340, L = 4, R = 36, T = 16, B = 24;
  const vals = pts.map(p => p.value), a = avg(vals);
  const s = scaleY(m.total && m.goal ? vals.concat(m.goal) : vals, H - B, T, !!m.total);
  const slot = (W - L - R) / pts.length, cx = i => L + slot * (i + .5);
  const ticks = [s.lo + (s.hi - s.lo) * .15, (s.lo + s.hi) / 2, s.lo + (s.hi - s.lo) * .85];
  let marks;
  if (m.total) {
    marks = pts.map((p, i) => `<rect x="${cx(i) - slot * .32}" y="${s.y(p.value)}" width="${slot * .64}" height="${Math.max(s.y(s.lo) - s.y(p.value), 1)}" rx="5" fill="${i === sel ? "#fff" : m.tint}" fill-opacity="${i === sel || sel == null ? 1 : .55}"/>`).join("");
  } else {
    const xy = pts.map((p, i) => [cx(i), s.y(p.value)]);
    marks = `<path d="${smooth(xy)}" fill="none" stroke="${m.tint}" stroke-width="3" stroke-linecap="round"/>` +
      xy.map(([px, py], i) => `<circle cx="${px}" cy="${py}" r="${i === sel ? 6 : 3}" fill="${i === sel ? "#fff" : m.tint}"/>`).join("");
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${m.title}, last ${pts.length} days" id="dchart">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${s.y(v)}" y2="${s.y(v)}" stroke="#ffd6dc" stroke-opacity=".07"/><text x="${W - R + 6}" y="${s.y(v) + 3}">${fmt(m, v)}</text>`).join("")}
    ${m.total && m.goal ? `<line x1="${L}" x2="${W - R}" y1="${s.y(m.goal)}" y2="${s.y(m.goal)}" stroke="${m.tint}" stroke-opacity=".6"/><text x="${L + 2}" y="${s.y(m.goal) - 5}" style="fill:${m.tint}">Goal</text>` : ""}
    ${a != null ? `<line x1="${L}" x2="${W - R}" y1="${s.y(a)}" y2="${s.y(a)}" stroke="#fff" stroke-opacity=".3" stroke-dasharray="4 4"/>` : ""}
    ${marks}
    ${pts.map((p, i) => i % 2 === pts.length % 2 ? "" : `<text x="${cx(i)}" y="${H - 6}" text-anchor="middle">${p.date.toLocaleDateString([], { weekday: "narrow" })}</text>`).join("")}
    <rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent" data-slots="${pts.length}"/></svg>`;
}
function nightsChart(nights) {
  const W = 340, H = 150, L = 4, R = 26, T = 10, B = 22;
  const s = scaleY(nights.map(n => n.asleep / 60).concat(9), H - B, T, true);
  const slot = (W - L - R) / nights.length, id = "n" + (++uid);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Hours asleep per night">
    <defs><linearGradient id="${id}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${C.violet}"/><stop offset="1" stop-color="${C.sky}"/></linearGradient></defs>
    ${[0, 4, 8].map(v => `<line x1="${L}" x2="${W - R}" y1="${s.y(v)}" y2="${s.y(v)}" stroke="#fff" stroke-opacity="${v === 8 ? .25 : .06}" ${v === 8 ? 'stroke-dasharray="4 4"' : ""}/><text x="${W - R + 6}" y="${s.y(v) + 3}">${v}h</text>`).join("")}
    ${nights.map((n, i) => `<rect x="${L + slot * i + slot * .18}" y="${s.y(n.asleep / 60)}" width="${slot * .64}" height="${s.y(0) - s.y(n.asleep / 60)}" rx="5" fill="url(#${id})"/>`).join("")}
    ${nights.map((n, i) => i % 2 ? "" : `<text x="${L + slot * (i + .5)}" y="${H - 6}" text-anchor="middle">${n.end.toLocaleDateString([], { weekday: "narrow" })}</text>`).join("")}</svg>`;
}

/* ---------- small pieces ---------- */
const fmtDur = min => { const t = Math.round(min); return t >= 60 ? `${Math.floor(t / 60)}h ${t % 60}m` : `${t}m`; };
const time = d => d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const title = (text, ic, tint, end = "") => `<div class="card-title"><span class="dot" style="background:${tint}22">${icon(ic, tint)}</span>${text}${end ? `<span class="end">${end}</span>` : ""}</div>`;
const pill = (label, value, tint = "var(--fg)") => `<div class="pill"><b style="color:${tint}">${value}</b><span>${label}</span></div>`;
function tile(id) {
  const m = M[id], l = latest(id);
  return `<button class="card tap tile" data-metric="${id}" style="text-align:left;color:inherit;font:inherit">
    <div class="head">${icon(m.icon, m.tint)}${m.title}</div>
    ${l ? `<div class="val">${fmt(m, l.value)}<small>${m.unit}</small></div>${spark(series(id), m.tint, m.total)}`
        : `<div class="val" style="color:var(--muted)">—</div><div class="note" style="height:34px">No data yet</div>`}
  </button>`;
}
const tiles = ids => `<div class="grid2">${ids.map(tile).join("")}</div>`;
const empty = (head, msg, ic) => `<div class="card" style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px"><span style="width:34px;height:34px;color:var(--muted)">${icon(ic)}</span><b>${head}</b><p class="note">${msg}</p></div>`;
function activityRings() {
  const rs = ["steps", "zoneMinutes", "calories"];
  return `<div class="card rings-row">
    <div class="ringwrap" style="width:132px;height:132px">${rs.map((id, i) => `<div style="position:absolute;inset:${i * 17}px">${ring((todayVal(id) || 0) / M[id].goal, [M[id].tint, M[id].tint + "99"], 132 - i * 34, 13)}</div>`).join("")}</div>
    <div class="legend">${rs.map(id => { const m = M[id]; return `<div class="row"><span class="sw" style="background:${m.tint}"></span><div><b>${fmt(m, todayVal(id) || 0)} ${m.unit}</b><small>${m.title} · goal ${fmt(m, m.goal)}</small></div></div>`; }).join("")}</div>
  </div>`;
}

/* ---------- screens ---------- */
function greeting() { const h = new Date().getHours(); return h >= 5 && h < 12 ? "Good morning" : h < 18 && h >= 12 ? "Good afternoon" : "Good evening"; }
function header(eyebrow, h) {

    <div style="display:flex;gap:8px;align-items:center"><span class="chip ${S.mode === "live" ? "live" : ""}">${S.mode === "live" ? "LIVE" : "DEMO"}</span>
    <button class="iconbtn ${S.syncing ? "spin" : ""}" id="syncBtn" aria-label="Refresh">${icon("sync")}</button></div></header>
    ${S.error ? `<div class="card warn" style="margin-bottom:14px">${esc(S.error)}</div>` : ""}${staleBar()}`;
}
const dateLine = () => new Date().toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });

function todayScreen() {

        <div class="hero-copy"><strong>${ch != null ? chargeLabel(ch) : "Wear your Air tonight to get your first recovery score."}</strong>

      </div>
      <div class="pills">${pill("Sleep score", n ? sleepScore(n) : "—", C.violet)}${pill("HRV", latest("hrv") ? Math.round(latest("hrv").value) + " ms" : "—", C.sky)}${pill("Resting HR", latest("restingHeartRate") ? Math.round(latest("restingHeartRate").value) + " bpm" : "—", C.pink)}</div>

function sleepScreen() {
  const n = lastNight(), nights = mainNights().slice(-HISTORY);
  let body;
  if (!n) body = empty("No sleep yet", "Wear your Fitbit Air to bed and your sleep stages show up here in the morning.", "moon");
  else {
    const sc = sleepScore(n), total = Math.max(n.stages.reduce((a, s) => a + (s.end - s.start) / 60000, 0), 1);
    body = `<div class="card hero">
        <div class="ringwrap" style="width:124px;height:124px">${ring(sc / 100, [C.violet, C.sky], 124, 14)}<div class="center"><div><div class="big" style="font-size:36px">${sc}</div><div class="sub">SCORE</div></div></div></div>
        <div class="hero-copy"><div class="eyebrow">Last night</div><div class="big" style="font-size:32px;margin:6px 0 10px">${fmtDur(n.asleep)}</div>
          <div class="pills" style="margin:0">${pill("Efficiency", Math.round(n.asleep / n.inBed * 100) + "%", C.mint)}${pill("Awake", fmtDur(n.awake), C.amber)}${n.toFallAsleep != null ? pill("Fell asleep in", fmtDur(n.toFallAsleep), C.sky) : ""}</div></div>
      </div>
      ${n.stages.length ? `<div class="card">${title("Stages", "bars", C.violet, `${time(n.start)} – ${time(n.end)}`)}${hypnogram(n)}
        <div class="stack" style="gap:10px;margin-top:14px">${STAGES.map(st => { const mins = n.minutes([st.id]);
          return `<div class="bar-row"><span>${st.label}</span><div class="track"><div class="fill" style="width:${mins / total * 100}%;background:${st.color}"></div></div><span class="t">${fmtDur(mins)}</span></div>`; }).join("")}</div></div>` : ""}
      <div class="card">${title(`Last ${nights.length} nights`, "cal", C.sky, "avg " + fmtDur(avg(nights.map(x => x.asleep))))}${nightsChart(nights)}</div>`;
  }
  return header("Sleep", "Recovery") + `<div class="stack">${bedBlock()}${body}<h2>While you slept</h2>${tiles(["hrv", "breathingRate", "spo2", "skinTemp"])}</div>`;
}

function heartScreen() {
  const hr = S.data.heart, b = hr.map(p => p.bpm), alerts = S.data.alerts;
  return header("Heart", "Your heart") + `<div class="stack">
    ${hr.length > 1 ? `<div class="card">${title("Today", "heart", C.pink)}
      <div class="pills" style="margin:0 0 12px">${pill("Now", Math.round(b[b.length - 1]), C.pink)}${pill("Low", Math.round(Math.min(...b)), C.sky)}${pill("High", Math.round(Math.max(...b)), C.amber)}${pill("Resting", latest("restingHeartRate") ? Math.round(latest("restingHeartRate").value) : "—", C.mint)}</div>
      ${hrChart(hr, 180)}<p class="note" style="margin-top:8px">Based on ${fmtDur(hr.length * 5)} of heart-rate readings today, shown as the middle value of every 5 minutes.</p>

function workoutIcon(t) { t = t.toLowerCase(); return t.includes("bike") || t.includes("cycl") ? "bike" : t.includes("swim") ? "swim" : t.includes("strength") || t.includes("weight") ? "lift" : t.includes("walk") || t.includes("hike") ? "walk" : "run"; }
function activityScreen() {

      : empty("No workouts yet", "Exercise sessions from your Air appear here.", "run")}

}

  ["wave", "Resting heart rate & HRV", "Your recovery baseline, measured overnight"],

function detail(id, sel = null) {
  const m = M[id], pts = series(id), vals = pts.map(p => p.value), a = avg(vals);
  const shown = sel != null ? pts[sel] : pts[pts.length - 1];
  const delta = shown && a ? (shown.value - a) / Math.abs(a) * 100 : null;
  document.getElementById("sheetBody").innerHTML = `
    <button class="back" id="closeSheet">${'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' + P.chev + "</svg>"}Back</button>
    <div class="stack" style="margin-top:10px">
      <div><div class="eyebrow">${m.title} · ${shown ? shown.date.toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" }) : "No data"}</div>
        <div class="detail-val" style="margin-top:8px;color:${m.tint}">${shown ? fmt(m, shown.value) : "—"}<small>${m.unit}</small></div>
        ${delta != null ? `<p class="note" style="margin-top:8px">${delta > 0 ? "+" : ""}${Math.round(delta)}% vs your ${pts.length}-day average</p>` : ""}
        ${shown?.note ? `<p class="note" style="margin-top:4px;color:var(--fg)">${esc(shown.note)}</p>` : ""}
        ${shown?.source ? `<p class="note" style="margin-top:4px">Recorded by ${esc(shown.source)}</p>` : ""}</div>
      ${pts.length ? `<div class="card">${dayChart(pts, m, sel)}<p class="note" style="margin-top:6px">Touch the chart to see any day.</p></div>
        <div class="card pills" style="margin:0">${pill("Average", fmt(m, a), m.tint)}${pill("Lowest", fmt(m, Math.min(...vals)))}${pill("Highest", fmt(m, Math.max(...vals)))}</div>` : ""}
      <div class="card">${title("About", "info", m.tint)}<p style="margin:0">${m.about}</p></div>
    </div>`;
  const sheet = document.getElementById("sheet");
  sheet.classList.add("open");
  document.getElementById("closeSheet").onclick = () => sheet.classList.remove("open");
  const hit = sheet.querySelector("[data-slots]");
  if (hit) {
    const pick = e => {
      const svg = hit.ownerSVGElement, r = svg.getBoundingClientRect(), pt = (e.touches ? e.touches[0] : e);
      const vx = (pt.clientX - r.left) / r.width * 340, i = Math.floor((vx - 4) / ((340 - 40) / pts.length));
      const idx = Math.max(0, Math.min(pts.length - 1, i));
      if (idx !== sel) detail(id, idx);
    };
    hit.addEventListener("pointerdown", pick);
    hit.addEventListener("pointermove", e => { if (e.buttons) pick(e); });
  }
}

    load: Math.round(trimp), recovery1: endHr != null && r1 != null ? Math.round(endHr - r1) : null, recovery2: endHr != null && r2 != null ? Math.round(endHr - r2) : null,
    steps: raw.steps, km: raw.km, azm: raw.azm,
    kcal: raw.kcal != null ? { v: raw.kcal, how: raw.kcalHow || "from Google Health" } : kcalEst > 0 ? { v: kcalEst, how: "estimated from your heart rate" } : null,
    profile: h, fetched: Date.now(),
  };
}

async function fetchSession(sess) {
  const a = new Date(sess.start), z = new Date(sess.end), z3 = new Date(z.getTime() + 180000);
  const span = (field, from, to) => `${field} >= "${iso(from)}" AND ${field} < "${iso(to)}"`;
  const inside = (d, from, to) => d && d >= from && d < to;
  const [hrPts, stepPts, distPts, azmPts, kcal] = await Promise.all([
    list("heart-rate", span("heartRate.sample_time.physical_time", a, z3), 10000, 4),
    list("steps", span("steps.interval.start_time", a, z), 1440, 2).catch(() => null),
    list("distance", span("distance.interval.start_time", a, z), 1440, 2).catch(() => null),
    list("active-zone-minutes", span("activeZoneMinutes.interval.start_time", a, z), 1440, 2).catch(() => null),
    call(`${API}/users/me/dataTypes/total-calories/dataPoints:rollUp`, { method: "POST",
      body: JSON.stringify({ range: { startTime: iso(a), endTime: iso(z) }, windowSize: Math.max(60, Math.round((z - a) / 1000)) + "s" }) })
      .then(j => (j.rollupDataPoints || []).reduce((s, p) => s + (num(p.totalCalories?.kcalSum) || 0), 0) || null).catch(() => null),
  ]);
  // Every point is re-checked against the session window, so nothing outside your workout is counted.
  const hr = hrPts.map(p => ({ t: toDate(p.heartRate?.sampleTime?.physicalTime), bpm: inRange(num(p.heartRate?.beatsPerMinute), 25, 230) }))
    .filter(s => s.t && s.bpm != null && inside(s.t, a, z3));
  const sum = (pts, key, field) => pts == null ? null : pts.filter(p => inside(toDate(p[key]?.interval?.startTime), a, z)).reduce((s, p) => s + (num(p[key]?.[field]) || 0), 0);
  const mm = sum(distPts, "distance", "millimeters");
  return analyse(sess, { hr, steps: sum(stepPts, "steps", "count"), km: mm == null ? null : mm / 1e6, azm: sum(azmPts, "activeZoneMinutes", "activeZoneMinutes"), kcal });
}

function demoSession(sess) {
  const a = new Date(sess.start), z = new Date(sess.end), k = INTENSITY[sess.sport] || .6, h = hrProfile();
  const target = b => h.rest + (h.max - h.rest) * b;
  const hr = []; let seed = a.getTime() % 9973;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let t = a.getTime(); t <= z.getTime() + 180000; t += 5000) {
    const p = (t - a) / Math.max(z - a, 1);
    let b = t > z.getTime() ? target(k) - (t - z) / 1000 * .28 : target(Math.min(k * (.55 + p * 4), k + .12 * Math.sin(p * 14)));
    hr.push({ t: new Date(t), bpm: Math.max(h.rest + 5, b + (rnd() - .5) * 8) });
  }
  const mins = (z - a) / 60000;
  return analyse(sess, { hr, steps: ["Running", "Walking", "Hiking", "Football", "Basketball", "Tennis", "Padel", "Dance"].includes(sess.sport) ? Math.round(mins * (sess.sport === "Running" ? 160 : 95)) : null,
    km: sess.sport === "Running" ? mins / 5.8 : sess.sport === "Walking" || sess.sport === "Hiking" ? mins / 11 : sess.sport === "Cycling" ? mins / 2.6 : null,
    azm: null, kcal: mins * (4 + k * 9), kcalHow: "demo numbers" });
}

function sessionChart(r, start, end) {
  const pts = r.samples.map(s => ({ t: s.t, bpm: s.bpm })); if (pts.length < 2) return "";
  const Wd = 340, H = 190, L = 4, R = 32, T = 10, B = 22, t0 = start, t1 = Math.max(end + 180000, pts[pts.length - 1].t);
  const x = t => L + (Wd - L - R) * (t - t0) / (t1 - t0), h = r.profile;
  const lo = Math.min(h.rest, ...pts.map(p => p.bpm)) - 5, hi = Math.max(h.max * .95, ...pts.map(p => p.bpm)) + 5;
  const y = v => T + (H - B - T) * (1 - (v - lo) / (hi - lo));
  const thr = [.4, .6, .85].map(f => h.rest + (h.max - h.rest) * f);
  const bands = [[lo, thr[0], ZONES[0]], [thr[0], thr[1], ZONES[1]], [thr[1], thr[2], ZONES[2]], [thr[2], hi, ZONES[3]]];
  const xy = pts.map(p => [x(p.t), y(p.bpm)]);
  return `<svg class="chart" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Heart rate during the workout">
    ${bands.map(([a, b, z]) => `<rect x="${L}" y="${y(b)}" width="${Wd - L - R}" height="${Math.max(y(a) - y(b), 0)}" fill="${z.color}" fill-opacity=".07"/><text x="${Wd - R + 4}" y="${(y(a) + y(b)) / 2 + 3}" style="font-size:8.5px">${Math.round(a)}</text>`).join("")}
    <rect x="${x(end)}" y="${T}" width="${Wd - R - x(end)}" height="${H - B - T}" fill="#000" fill-opacity=".35"/>
    <text x="${x(end) + 4}" y="${T + 10}" style="font-size:9px">Recovery</text>
    <path d="${smooth(xy)}" fill="none" stroke="${C.mint}" stroke-width="2.2"/>
    <text x="${L}" y="${H - 6}">${time(new Date(start))}</text><text x="${x(end)}" y="${H - 6}" text-anchor="middle">${time(new Date(end))}</text></svg>`;
}
function summaryLine(r) {
  const top = ZONES.slice().sort((a, b) => r.zones[b.id] - r.zones[a.id])[0], pct = Math.round(r.max / r.profile.max * 100), parts = [];

  return parts.join(" ");
}

/* --- lift tracker --- */
function liftHistory() { // per exercise, oldest first: [{date, sets, top, e1, vol}]
  const map = {};
  W.sessions().slice().reverse().forEach(s => {
    const by = {};
    (s.sets || []).forEach(x => (by[x.ex] = by[x.ex] || []).push(x));
    Object.entries(by).forEach(([ex, sets]) => {
      const top = sets.reduce((a, b) => e1rm(b.kg, b.reps) > e1rm(a.kg, a.reps) ? b : a);
      (map[ex] = map[ex] || []).push({ date: new Date(s.start), sessionId: s.id, sets, top, e1: e1rm(top.kg, top.reps), vol: sets.reduce((a, b) => a + b.kg * b.reps, 0) });
    });

}
function liftAdvice(ex, hist) {
  const h = hist[ex]; if (!h || !h.length) return null;
  const last = h[h.length - 1], prev = h[h.length - 2], step = LOWER.includes(ex) ? 5 : 2.5;
  const topKg = Math.max(...last.sets.map(s => s.kg)), atTop = last.sets.filter(s => s.kg === topKg);
  const ch = charge();
  if (ch != null && ch < 50) return { tone: "amber", text: `Recovery is ${ch}% today. Stay at ${topKg} kg or less and stop 2 reps short of failure.` };
  if (prev) {
    const pTop = Math.max(...prev.sets.map(s => s.kg));
    const pReps = Math.max(...prev.sets.filter(s => s.kg === pTop).map(s => s.reps)), lReps = Math.max(...atTop.map(s => s.reps));
    if (pTop === topKg && lReps < pReps - 1) return { tone: "amber", text: `Reps dropped at ${topKg} kg (${pReps} → ${lReps}). Hold the weight and recover before pushing.` };
  }
  if (atTop.length >= 2 && atTop.every(s => s.reps >= 8)) return { tone: "mint", text: `Ready to progress: try ${r05(topKg + step)} kg next time.` };
  return { tone: "sky", text: `Stay at ${topKg} kg and aim for one more rep per set.` };
}

/* --- body battery: starts at your morning Charge, drains with every awake minute, faster in heart-rate zones --- */
function battery() {
  const ch = charge(); if (ch == null || !S.data) return null;
  const n = lastNight(), today0 = startOfDay(new Date());
  const wake = n && n.end > today0 - 6 * 3600000 ? n.end : today0;
  const hp = hrProfile(), hrr = Math.max(hp.max - hp.rest, 40);
  let lvl = ch, prev = +wake, used = 0;
  const pts = [[+wake, lvl]];
  for (const p of S.data.heart.filter(p => p.time > wake && p.time <= Date.now())) {
    const dt = Math.min((p.time - prev) / 60000, 15); prev = +p.time;
    const f = (p.bpm - hp.rest) / hrr;
    const rate = f < .15 ? .03 : f < .4 ? .07 : f < .6 ? .25 : f < .85 ? .5 : .9;
    const d = rate * dt; used += d; lvl = Math.max(5, lvl - d); pts.push([+p.time, lvl]);
  }
  const tail = Math.min((Date.now() - prev) / 60000, 60) * .03; lvl = Math.max(5, lvl - tail); pts.push([Date.now(), lvl]);
  return { now: Math.round(lvl), start: ch, pts, wake };
}
const batteryLabel = v => v >= 70 ? "Plenty left. Go hard today." : v >= 45 ? "Enough for a normal session." : v >= 25 ? "Running low. Keep it light." : "Empty. Rest and sleep early.";
function batteryCard() {
  const b = battery(); if (!b) return "";
  const col = b.now >= 45 ? C.mint : b.now >= 25 ? C.amber : "#ff1033";
  const Wd = 340, H = 64, t0 = b.pts[0][0], t1 = Math.max(Date.now(), t0 + 3600000), x = t => 2 + (Wd - 4) * (t - t0) / (t1 - t0), y = v => 4 + (H - 8) * (1 - v / 100);
  const line = smooth(b.pts.map(([t, v]) => [x(t), y(v)]));
  return `<div class="card">${title("Body battery", "bolt", col, `started at ${b.start}`)}
    <div class="battery"><div class="batt"><div class="fill" style="width:${b.now}%;background:${col}"></div></div><b style="color:${col}">${b.now}</b></div>
    <p style="margin:8px 0 0;font-weight:700">${batteryLabel(b.now)}</p>
    <svg class="chart" viewBox="0 0 ${Wd} ${H}" style="margin-top:8px" aria-hidden="true"><path d="${line}" fill="none" stroke="${col}" stroke-width="2"/></svg>
    <p class="note">Pulse's estimate. It starts each morning at your recovery score, drains slowly while you're awake and faster in your heart-rate zones.${(() => { const c = heartCoverage(b.wake); return c == null ? "" : c >= .8 ? ` Based on ${Math.round(c * 100)}% of today's heart data.` : ` <span style="color:${C.amber}">Only ${Math.round(c * 100)}% of today's heart data so far, so treat this as rough.</span>`; })()}</p></div>`;
}

/* --- sick early warning --- */
function sickCheck() {
  const out = [];
  const add = (id, label, test, show) => {
    const s = fullSeries(id); if (s.length < 5) return;
    const last = s[s.length - 1]; if (Date.now() - last.date > 2.5 * DAY) return;
    const base = median(s.slice(0, -1).map(p => p.value));
    out.push({ id, label, on: test(last.value, base), text: show(last.value, base) });
  };
  add("skinTemp", "Skin temperature", v => v >= .5, v => `${v > 0 ? "+" : ""}${v.toFixed(1)} °C vs your baseline`);
  add("restingHeartRate", "Resting heart rate", (v, b) => v - b >= 3, (v, b) => `${Math.round(v)} bpm (normal ${Math.round(b)})`);
  add("breathingRate", "Breathing rate", (v, b) => v - b >= 1, (v, b) => `${v.toFixed(1)} br/min (normal ${b.toFixed(1)})`);
  add("hrv", "HRV", (v, b) => v <= b * .85, (v, b) => `${Math.round(v)} ms (normal ${Math.round(b)})`);
  const n = out.filter(x => x.on).length;
  return { signals: out, count: n, level: n >= 3 ? "high" : n === 2 ? "watch" : "ok" };
}
function sickCard(always) {
  const c = sickCheck(); if (!c.signals.length || (!always && c.level === "ok")) return "";
  const col = c.level === "high" ? "#ff1033" : c.level === "watch" ? C.amber : C.mint;
  const head = c.level === "high" ? "Your body may be fighting something" : c.level === "watch" ? "Two warning signs last night" : "No signs of getting sick";
  const msg = c.level === "high" ? "Several signals moved together, which often shows up a day or two before you feel ill. Take a rest day, drink more and sleep early." : c.level === "watch" ? "Could be a hard session, alcohol or stress, or the start of a bug. Go easy today and see how tomorrow looks." : "Temperature, resting heart rate, breathing and HRV all look normal for you.";
  return `<div class="card" style="border-color:${col}66">${title("Body check", c.level === "ok" ? "shield" : "alert", col, c.level === "ok" ? "" : `${c.count} of ${c.signals.length} signals`)}
    <strong style="display:block;font-size:16px">${head}</strong><p class="note" style="margin:4px 0 12px;color:var(--fg);opacity:.8">${msg}</p>
    <div class="stack" style="gap:8px">${c.signals.map(s => `<div class="sigrow"><span class="sd" style="background:${s.on ? col : "rgba(255,255,255,.18)"}"></span><b>${s.label}</b><span>${s.text}</span></div>`).join("")}</div>
    <p class="note" style="margin-top:10px">Not a diagnosis. If you feel unwell or this lasts several days, see a doctor.</p></div>`;
}

/* --- weekly report card --- */
const letter = s => s == null ? "—" : (s >= 90 ? "A" : s >= 80 ? "B" : s >= 70 ? "C" : s >= 60 ? "D" : "F") + (s >= 60 && s < 100 && s % 10 >= 7 ? "+" : "");
function weekReport() {

    rows.push({ k: "Sleep", s: Math.round(sc), why: `${hrs.toFixed(1)} h a night on average, sleep score ${Math.round(sc)}.` }); }
  const zm = series("zoneMinutes").slice(-7).reduce((a, p) => a + p.value, 0), sessions = W.sessions().filter(s => s.start > cut).length + (S.data?.workouts || []).filter(w => w.start > cut).length;
  if (series("zoneMinutes").length) rows.push({ k: "Training", s: Math.round(Math.min(zm / 150, 1.05) * 95), why: `${Math.round(zm)} of 150 zone minutes, ${sessions} workouts.` });
  const hrv = series("hrv").map(p => p.value), rhr = series("restingHeartRate").map(p => p.value);
  if (hrv.length >= 10 && rhr.length >= 10) { const hp = (avg(hrv.slice(-7)) / avg(hrv.slice(-14, -7)) - 1) * 100, rd = avg(rhr.slice(-7)) - avg(rhr.slice(-14, -7));
    rows.push({ k: "Recovery", s: Math.round(clamp(85 + hp * 1.5 - rd * 6)), why: `HRV ${hp >= 0 ? "up" : "down"} ${Math.abs(hp).toFixed(0)}% and resting HR ${rd >= 0 ? "up" : "down"} ${Math.abs(rd).toFixed(1)} bpm vs the week before.` }); }
  if (nights.length >= 4) { const mins = nights.map(n => { const d = new Date(n.start); let m = d.getHours() * 60 + d.getMinutes(); if (m < 720) m += 1440; return m; });
    const mu = avg(mins), sd = Math.sqrt(avg(mins.map(m => (m - mu) ** 2)));
    rows.push({ k: "Consistency", s: Math.round(clamp(100 - Math.max(sd - 20, 0))), why: `Bedtime varied by about ${Math.round(sd)} minutes. Under 30 is ideal.` }); }
  const steps = series("steps").slice(-8, -1).map(p => p.value);
  if (steps.length >= 3) { const a = avg(steps); rows.push({ k: "Movement", s: Math.round(Math.min(a / 10000, 1.05) * 95), why: `${Math.round(a).toLocaleString()} steps a day on average.` }); }
  return { rows, overall: rows.length ? Math.round(avg(rows.map(r => r.s))) : null };
}

  if (!f) return { muscles: {}, hard: false };

/* ---------- recovery: one score from HRV, resting HR, sleep, sleep debt, training strain and illness signs, each vs your own baseline ---------- */
const SLEEP_NEED = 480; // minutes; adjusted to his own average if he regularly sleeps well
const valOn = (id, t0) => { const p = fullSeries(id).find(p => p.date >= t0 && p.date < t0 + DAY); return p ? p.value : null; };
const before = (id, t0, n = 30) => fullSeries(id).filter(p => p.date < t0).slice(-n).map(p => p.value);
const sd = v => { if (v.length < 3) return null; const m = avg(v); return Math.sqrt(avg(v.map(x => (x - m) ** 2))); };
function nightFor0(t0) { return mainNights().filter(n => n.end >= t0 - 6 * 3600000 && n.end < t0 + 16 * 3600000).slice(-1)[0] || null; }
function sessionLoad(s) { return s.result?.status === "ready" ? s.result.load : (INTENSITY[s.sport] || .6) * (s.end - s.start) / 60000 * 1.5; }
function dayStrain(t0) { // zone minutes from the Air, weighted like training load, plus Pulse sessions not already in them
  const zm = valOn("zoneMinutes", t0) || 0;
  const ses = W.sessions().filter(s => s.end >= t0 && s.end < t0 + DAY);
  const fromSessions = ses.reduce((a, s) => a + sessionLoad(s), 0);
  return Math.max(zm * 1.8, fromSessions);
}

/* Recovery for the morning of day t0 (midnight). Uses only data you had by then. */
function recoveryAt(t0) {
  const parts = [];
  const add = (key, label, score, weight, detail) => parts.push({ key, label, score: Math.round(clamp(score)), weight, detail });
  // 1. HRV: log-scaled, compared with your normal spread (z-score), so a small dip on a steady baseline counts more than on a noisy one
  const hv = valOn("hrv", t0), hb = before("hrv", t0).filter(v => v > 0);
  if (hv && hb.length >= 5) {
    const lb = hb.map(Math.log), z = (Math.log(hv) - avg(lb)) / Math.max(sd(lb), .05);
    add("hrv", "HRV", 70 + z * 18, .3, `${Math.round(hv)} ms vs your normal ${Math.round(median(hb))} ms`);
  }
  // 2. Resting heart rate: higher than normal means your body is still working
  const rv = valOn("restingHeartRate", t0), rb = before("restingHeartRate", t0);
  if (rv && rb.length >= 5) {
    const z = (rv - avg(rb)) / Math.max(sd(rb), 1);
    add("rhr", "Resting heart rate", 70 - z * 18, .2, `${Math.round(rv)} bpm vs your normal ${Math.round(median(rb))} bpm`);
  }
  // 3. Last night's sleep
  const n = nightFor0(t0);
  if (n) add("sleep", "Last night's sleep", sleepScore(n), .25, `${fmtDur(n.asleep)} asleep, score ${sleepScore(n)}`);
  // 4. Sleep debt over the last 3 nights
  const nights = [0, 1, 2].map(i => nightFor0(t0 - i * DAY)).filter(Boolean);
  if (nights.length >= 2) {
    const debt = nights.reduce((a, x) => a + Math.max(0, SLEEP_NEED - x.asleep), 0) * 3 / nights.length;
    add("debt", "Sleep debt (3 nights)", 100 - debt / 60 * 14, .1, debt < 30 ? "None worth noting" : `${fmtDur(debt)} short of 8 h a night, over 3 nights`);
  }
  // 5. Training strain: the last 2 days compared with what you usually do (acute vs chronic load)
  const has = d => valOn("zoneMinutes", d) != null || W.sessions().some(s => s.end >= d && s.end < d + DAY);
  const days = Array.from({ length: 28 }, (_, i) => t0 - (i + 1) * DAY).filter(has).map(dayStrain);
